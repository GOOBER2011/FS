<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUN CHAT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='16' fill='none' stroke='%23d4cfc6' stroke-width='1.5'/%3E%3Cg stroke='%23d4cfc6' stroke-width='1.2' fill='none' stroke-linecap='round'%3E%3Cpath d='M50 8 Q52 18 50 26'/%3E%3Cpath d='M50 92 Q48 82 50 74'/%3E%3Cpath d='M8 50 Q18 48 26 50'/%3E%3Cpath d='M92 50 Q82 52 74 50'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0c0b0a;
    --bg-2: #131211;
    --bg-3: #1a1817;
    --line: #262422;
    --line-2: #35322e;
    --ink: #e2ddd4;
    --ink-2: #a39d93;
    --ink-3: #6b6660;
    --accent: #ddd7cb;
    --accent-bright: #f2ece1;
    --danger: #c17a6b;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; font-family: var(--mono); }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    background-image:
      radial-gradient(ellipse at 50% -20%, rgba(220, 210, 190, 0.05), transparent 60%),
      radial-gradient(ellipse at 50% 120%, rgba(220, 210, 190, 0.03), transparent 60%);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e2b28; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #423e39; }

  /* ============ LOADING SCREEN ============ */
  #loader {
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.7s ease;
    background-image: radial-gradient(ellipse at 50% 50%, rgba(220, 210, 190, 0.06), transparent 60%);
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .load-sun {
    margin-bottom: 40px;
    animation: slow-spin 20s linear infinite;
    filter: drop-shadow(0 0 30px rgba(220, 210, 190, 0.15));
  }
  @keyframes slow-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  #loader .load-title {
    font-family: var(--serif); font-size: 30px;
    letter-spacing: 14px; text-transform: uppercase;
    color: var(--ink); margin-bottom: 14px;
  }
  #loader .load-sub {
    font-family: var(--serif); font-style: italic;
    font-size: 15px; color: var(--ink-3); letter-spacing: 0.5px;
  }
  #loader .load-bar {
    margin-top: 44px; width: 240px; height: 1px;
    background: var(--line); position: relative; overflow: hidden;
  }
  #loader .load-bar::after {
    content: ''; position: absolute; inset: 0;
    background: var(--accent);
    animation: load-fill 3s cubic-bezier(0.6, 0, 0.4, 1) forwards;
  }
  @keyframes load-fill {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
  }

  /* ============ SUN ICON ============ */
  .sun-icon { display: inline-block; vertical-align: middle; }
  .sun-icon svg { display: block; }
  .sun-svg { stroke: var(--accent); fill: none; stroke-width: 1; }
  .sun-svg .core { fill: none; stroke-width: 1.5; }
  .sun-svg .face { stroke-width: 0.8; opacity: 0.75; }

  /* ============ LOGIN ============ */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
    background: radial-gradient(ellipse at 50% 50%, rgba(220, 210, 190, 0.05), transparent 70%);
  }
  .login-box {
    background: linear-gradient(180deg, rgba(24, 22, 20, 0.98) 0%, rgba(14, 13, 12, 0.98) 100%);
    border: 1px solid var(--line-2);
    padding: 68px 56px 56px;
    width: 520px; max-width: 100%;
    box-shadow: 0 40px 100px rgba(0,0,0,0.85);
    position: relative;
    text-align: center;
  }
  .login-box::before, .login-box::after {
    content: ''; position: absolute; width: 20px; height: 20px;
    border: 1px solid var(--line-2);
  }
  .login-box::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .login-box::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .login-logo {
    display: flex; justify-content: center; margin-bottom: 24px;
    filter: drop-shadow(0 0 40px rgba(220, 210, 190, 0.12));
  }
  .login-box .year {
    font-family: var(--mono); font-size: 12px; letter-spacing: 6px;
    color: var(--ink-3); margin-bottom: 28px;
  }
  .login-box h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: 38px; letter-spacing: 16px; margin-bottom: 12px;
    color: var(--ink); text-transform: uppercase;
  }
  .login-box .tagline {
    font-family: var(--serif); font-style: italic;
    font-size: 15px; color: var(--ink-3); letter-spacing: 0.5px;
    margin-bottom: 44px; line-height: 1.6;
  }
  .login-box .rule {
    height: 1px; background: var(--line); margin: 0 auto 36px; width: 50%;
  }
  .login-box input {
    width: 100%; background: #0c0b0a; color: var(--ink);
    border: 1px solid var(--line); padding: 16px 18px;
    font-size: 15px; font-family: var(--mono); letter-spacing: 1.5px;
    margin-bottom: 14px; outline: none; transition: 0.2s;
  }
  .login-box input::placeholder {
    color: var(--ink-3); text-transform: uppercase; font-size: 12px; letter-spacing: 4px;
  }
  .login-box input:focus { border-color: var(--line-2); background: #151311; }
  .login-box button {
    width: 100%; padding: 17px; border: 1px solid var(--line-2);
    background: transparent; color: var(--ink);
    font-family: var(--mono); font-size: 13px; font-weight: 500;
    letter-spacing: 5px; text-transform: uppercase; cursor: pointer;
    margin-top: 8px; transition: 0.2s;
  }
  .login-box button:hover { background: #1c1a17; border-color: var(--accent); }
  .login-box button.primary {
    background: var(--accent); color: #0c0b0a; border-color: var(--accent);
  }
  .login-box button.primary:hover { background: var(--accent-bright); }
  #loginMsg {
    font-size: 12px; color: var(--danger); min-height: 18px;
    margin-top: 18px; letter-spacing: 1.5px;
  }

  /* ============ APP ============ */
  #app { display: none; height: 100vh; width: 100vw; }
  .sidebar {
    width: 300px; background: linear-gradient(180deg, #100f0e 0%, #0b0a09 100%);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100%;
  }
  .sidebar-header {
    padding: 28px 22px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
  }
  .sidebar-header .brand {
    font-family: var(--serif); font-weight: 400;
    font-size: 19px; letter-spacing: 8px; text-transform: uppercase;
    color: var(--ink);
  }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 16px 10px; }

  .section-label {
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 4px;
    color: var(--ink-3); padding: 20px 14px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-label button {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    cursor: pointer; font-size: 14px; line-height: 1;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: var(--mono);
  }
  .section-label button:hover { color: var(--ink); border-color: var(--line-2); background: #1c1a17; }

  .sidebar-item {
    padding: 12px 14px; cursor: pointer;
    display: flex; align-items: center; gap: 12px; font-size: 15px;
    color: var(--ink-2); margin: 2px 0; transition: 0.15s;
    position: relative;
    border-left: 2px solid transparent;
  }
  .sidebar-item:hover { background: #161513; color: var(--ink); }
  .sidebar-item.active {
    background: #191714; color: var(--ink);
    border-left: 2px solid var(--accent);
  }
  .sidebar-item .hash {
    color: var(--ink-3); font-family: var(--serif); font-size: 18px;
    width: 18px; text-align: center;
  }
  .sidebar-item.active .hash { color: var(--accent); }
  .sidebar-item .pending {
    font-size: 10px; color: var(--accent); margin-left: auto;
    border: 1px solid var(--line-2); padding: 2px 7px;
    letter-spacing: 3px; font-weight: 500;
  }

  .mini-avatar {
    width: 30px; height: 30px; background: #1c1a17;
    display: flex; align-items: center; justify-content: center;
    font-weight: 400; font-size: 13px; overflow: hidden;
    border: 1px solid var(--line); flex-shrink: 0;
    color: var(--ink-2); font-family: var(--serif);
    border-radius: 50%;
  }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-panel {
    padding: 18px 20px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
    background: rgba(10, 9, 8, 0.7);
  }
  .user-avatar {
    width: 46px; height: 46px; background: #1c1a17;
    display: flex; align-items: center; justify-content: center;
    font-weight: 400; font-size: 17px;
    border: 1px solid var(--line); overflow: hidden;
    cursor: pointer; flex-shrink: 0; transition: 0.2s;
    color: var(--accent); font-family: var(--serif);
    border-radius: 50%;
  }
  .user-avatar:hover { border-color: var(--line-2); }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-panel .info { flex: 1; font-size: 13px; overflow: hidden; min-width: 0; }
  .user-panel .info .name {
    font-family: var(--serif); font-size: 16px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.5px;
  }
  .user-panel .info .sub {
    color: var(--ink-3); font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; margin-top: 3px;
  }
  .user-panel .icon-btn {
    background: none; border: 1px solid transparent; color: var(--ink-3);
    cursor: pointer; font-size: 15px; padding: 8px 10px; transition: 0.15s;
    font-family: var(--mono);
  }
  .user-panel .icon-btn:hover { color: var(--ink); border-color: var(--line); }

  .main { flex: 1; display: flex; flex-direction: column; height: 100%; }
  .main-header {
    padding: 20px 32px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(10, 9, 8, 0.5); min-height: 80px;
  }
  .main-header .title {
    font-family: var(--serif); font-size: 21px; font-weight: 400;
    display: flex; align-items: center; gap: 10px; letter-spacing: 1px;
    color: var(--ink);
  }
  .main-header .title .hash { color: var(--accent); font-size: 24px; }
  .main-header .sub {
    font-family: var(--mono); color: var(--ink-3); font-size: 11px;
    margin-left: 12px; text-transform: uppercase; letter-spacing: 4px;
  }
  .call-actions { display: flex; gap: 10px; align-items: center; }
  .call-actions button {
    background: transparent; border: 1px solid var(--line); color: var(--ink-2);
    padding: 12px 22px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
    transition: 0.15s;
  }
  .call-actions button:hover { border-color: var(--line-2); color: var(--ink); background: #1a1817; }
  .call-actions button.active {
    background: var(--accent); color: #0c0b0a; border-color: var(--accent);
  }
  .call-actions button:disabled { opacity: 0.3; cursor: not-allowed; }
  .meter {
    display: flex; gap: 3px; height: 32px; align-items: flex-end;
    background: #0c0b0a; padding: 6px; border: 1px solid var(--line);
  }
  .bar { width: 4px; background: #2e2b28; height: 5px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 32px 40px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .msg { display: flex; gap: 18px; }
  .msg .avatar {
    width: 48px; height: 48px; background: #1c1a17;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; border: 1px solid var(--line);
    flex-shrink: 0; overflow: hidden;
    color: var(--accent); font-family: var(--serif);
    border-radius: 50%;
  }
  .msg .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .meta { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .msg .name {
    font-family: var(--serif); font-weight: 400;
    font-size: 17px; color: var(--ink); letter-spacing: 0.5px;
  }
  .msg .pronouns {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: 2px; text-transform: uppercase;
    padding: 2px 8px; border: 1px solid var(--line);
  }
  .msg .time {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    letter-spacing: 1.5px;
  }
  .msg .text {
    color: var(--ink); font-size: 16px; line-height: 1.7;
    word-break: break-word; font-family: var(--mono); font-weight: 300;
  }

  .composer {
    padding: 20px 32px 26px; border-top: 1px solid var(--line);
    display: flex; gap: 12px;
    background: rgba(10, 9, 8, 0.4);
  }
  .composer input {
    flex: 1; background: #0c0b0a; border: 1px solid var(--line);
    color: var(--ink); padding: 17px 20px;
    font-size: 15px; font-family: var(--mono); outline: none;
    letter-spacing: 0.5px; transition: 0.2s;
  }
  .composer input::placeholder {
    color: var(--ink-3); text-transform: uppercase;
    font-size: 12px; letter-spacing: 4px;
  }
  .composer input:focus { border-color: var(--line-2); background: #151311; }
  .composer button {
    background: var(--accent); color: #0c0b0a; border: 1px solid var(--accent);
    padding: 0 32px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase; transition: 0.15s;
  }
  .composer button:hover { background: var(--accent-bright); }

  /* ============ MODALS ============ */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    z-index: 90; overflow-y: auto; padding: 24px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #121110; border: 1px solid var(--line-2);
    padding: 40px 36px; width: 520px; max-width: 100%;
    box-shadow: 0 40px 90px rgba(0,0,0,0.9);
    position: relative;
  }
  .modal::before, .modal::after {
    content: ''; position: absolute; width: 16px; height: 16px;
    border: 1px solid var(--line-2);
  }
  .modal::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .modal::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .modal h3 {
    font-family: var(--serif); font-weight: 400;
    font-size: 20px; letter-spacing: 8px;
    text-transform: uppercase; color: var(--ink);
    margin-bottom: 28px; padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .modal label {
    display: block; font-family: var(--mono);
    font-size: 11px; text-transform: uppercase; color: var(--ink-3);
    margin-bottom: 8px; margin-top: 20px; letter-spacing: 4px;
  }
  .modal input, .modal textarea {
    width: 100%; background: #0c0b0a; color: var(--ink);
    border: 1px solid var(--line); padding: 14px 16px;
    font-size: 15px; font-family: var(--mono); outline: none;
    resize: vertical; transition: 0.2s; letter-spacing: 0.5px;
  }
  .modal textarea { min-height: 96px; }
  .modal input:focus, .modal textarea:focus {
    border-color: var(--line-2); background: #151311;
  }
  .modal .row { display: flex; gap: 12px; margin-top: 28px; }
  .modal button {
    padding: 14px 24px; border: 1px solid var(--line-2);
    background: transparent; color: var(--ink);
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    letter-spacing: 4px; text-transform: uppercase; cursor: pointer;
    transition: 0.15s;
  }
  .modal button:hover { background: #1c1a17; border-color: var(--accent); }
  .modal button.primary { background: var(--accent); color: #0c0b0a; border-color: var(--accent); }
  .modal button.primary:hover { background: var(--accent-bright); }
  .modal .msg {
    font-family: var(--mono); font-size: 12px; color: var(--danger);
    min-height: 18px; margin-top: 16px; letter-spacing: 1.5px;
  }

  .avatar-picker { display: flex; align-items: center; gap: 24px; margin-top: 12px; }
  .avatar-preview {
    width: 108px; height: 108px; background: #1c1a17;
    border: 1px solid var(--line-2); overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; color: var(--accent); font-family: var(--serif);
    position: relative;
    border-radius: 50%;
  }
  .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-picker input[type=file] { display: none; }
  .avatar-picker label.pick {
    display: inline-block; padding: 13px 20px;
    border: 1px solid var(--line-2); cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    letter-spacing: 3px; text-transform: uppercase; transition: 0.15s;
  }
  .avatar-picker label.pick:hover { color: var(--ink); border-color: var(--accent); background: #1c1a17; }
</style>
</head>
<body>

<!-- ============ LOADING SCREEN ============ -->
<div id="loader">
  <div class="load-sun">
    <svg width="130" height="130" viewBox="0 0 120 120">
      <g stroke="#d4cfc6" fill="none" stroke-width="1" stroke-linecap="round">
        <path d="M60 4 Q62 16 60 26"/>
        <path d="M60 116 Q58 104 60 94"/>
        <path d="M4 60 Q16 58 26 60"/>
        <path d="M116 60 Q104 62 94 60"/>
        <path d="M20 20 Q29 30 34 34"/>
        <path d="M100 100 Q91 90 86 86"/>
        <path d="M20 100 Q29 90 34 86"/>
        <path d="M100 20 Q91 30 86 34"/>
        <path d="M38 10 Q44 20 45 26"/>
        <path d="M82 10 Q76 20 75 26"/>
        <path d="M38 110 Q44 100 45 94"/>
        <path d="M82 110 Q76 100 75 94"/>
        <path d="M10 38 Q20 44 26 45"/>
        <path d="M10 82 Q20 76 26 75"/>
        <path d="M110 38 Q100 44 94 45"/>
        <path d="M110 82 Q100 76 94 75"/>
      </g>
      <circle cx="60" cy="60" r="30" stroke="#d4cfc6" fill="none" stroke-width="1.2"/>
      <circle cx="60" cy="60" r="27" stroke="#d4cfc6" fill="none" stroke-width="0.5" opacity="0.6"/>
    </svg>
  </div>
  <div class="load-title">Sun Chat</div>
  <div class="load-sub">the sun does not count. the sun is counted.</div>
  <div class="load-bar"></div>
</div>

<!-- ============ MEDIEVAL SUN SVG SYMBOL ============ -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="sun-symbol" viewBox="0 0 120 120">
    <g class="sun-svg">
      <g stroke-linecap="round" fill="none" stroke-width="0.9">
        <path d="M60 4 Q62 16 60 26"/>
        <path d="M60 116 Q58 104 60 94"/>
        <path d="M4 60 Q16 58 26 60"/>
        <path d="M116 60 Q104 62 94 60"/>
        <path d="M20 20 Q29 30 34 34"/>
        <path d="M100 100 Q91 90 86 86"/>
        <path d="M20 100 Q29 90 34 86"/>
        <path d="M100 20 Q91 30 86 34"/>
        <path d="M38 10 Q44 20 45 26"/>
        <path d="M82 10 Q76 20 75 26"/>
        <path d="M38 110 Q44 100 45 94"/>
        <path d="M82 110 Q76 100 75 94"/>
        <path d="M10 38 Q20 44 26 45"/>
        <path d="M10 82 Q20 76 26 75"/>
        <path d="M110 38 Q100 44 94 45"/>
        <path d="M110 82 Q100 76 94 75"/>
      </g>
      <circle cx="60" cy="60" r="30" class="core" stroke-width="1.2"/>
      <circle cx="60" cy="60" r="27" stroke-width="0.5" opacity="0.6"/>
      <g class="face" stroke-linecap="round" fill="none">
        <path d="M52 56 L56 56"/>
        <path d="M64 56 L68 56"/>
        <path d="M60 58 L60 64"/>
        <path d="M55 68 Q60 71 65 68"/>
        <circle cx="52" cy="63" r="0.6" fill="var(--accent)" stroke="none"/>
        <circle cx="68" cy="63" r="0.6" fill="var(--accent)" stroke="none"/>
      </g>
      <path d="M60 48 L61.5 51 L64.5 51.5 L62 53.5 L62.8 56.5 L60 55 L57.2 56.5 L58 53.5 L55.5 51.5 L58.5 51 Z"
            fill="var(--accent)" opacity="0.85"/>
    </g>
  </symbol>
</svg>

<!-- LOGIN -->
<div id="login" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <svg width="110" height="110" viewBox="0 0 120 120"><use href="#sun-symbol"/></svg>
    </div>
    <div class="year">MMXXV</div>
    <h1>Sun Chat</h1>
    <div class="tagline">a place beneath the light.<br>speak. gather. be counted.</div>
    <div class="rule"></div>
    <input id="email" type="email" placeholder="email">
    <input id="pass" type="password" placeholder="password">
    <button id="btnSignin" class="primary">Enter</button>
    <button id="btnSignup">Create Account</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="brand">Sun Chat</span>
    </div>
    <div class="sidebar-scroll">
      <div class="section-label">Chambers</div>
      <div id="channelList"></div>
      <div class="section-label">
        Kin
        <button id="addFriendBtn" title="Add friend">+</button>
      </div>
      <div id="friendsList"></div>
    </div>
    <div class="user-panel">
      <div class="user-avatar" id="myAvatar" title="Edit profile">?</div>
      <div class="info">
        <div class="name" id="myName">—</div>
        <div class="sub" id="myPronouns">present</div>
      </div>
      <button class="icon-btn" id="btnEditProfile" title="Edit profile">✎</button>
      <button class="icon-btn" id="btnSignout" title="Sign out">⎋</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div class="title" id="channelTitle"><span class="hash">#</span> general</div>
      <div class="call-actions">
        <div class="meter" id="meter">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <button id="btnCall">Begin Call</button>
        <button id="btnHangup" disabled>End</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="msgInput" placeholder="message...">
      <button id="btnSend">Send</button>
    </div>
  </main>
</div>

<!-- ADD FRIEND MODAL -->
<div class="modal-backdrop" id="friendModal">
  <div class="modal">
    <h3>Summon Kin</h3>
    <input id="friendEmail" placeholder="friend@example.com">
    <div class="row">
      <button id="btnSendRequest" class="primary">Send Request</button>
      <button id="btnCloseModal">Cancel</button>
    </div>
    <div class="msg" id="friendMsg"></div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal-backdrop" id="profileModal">
  <div class="modal">
    <h3>Inscribe Self</h3>
    <label>Portrait</label>
    <div class="avatar-picker">
      <div class="avatar-preview" id="avatarPreview">?</div>
      <div>
        <input type="file" id="avatarInput" accept="image/*">
        <label for="avatarInput" class="pick">Choose File</label>
      </div>
    </div>
    <label>Name</label>
    <input id="pfDisplayName" placeholder="Your name">
    <label>Pronouns</label>
    <input id="pfPronouns" placeholder="they/them">
    <label>Inscription</label>
    <textarea id="pfBio" placeholder="A little about you..."></textarea>
    <div class="row">
      <button id="btnSaveProfile" class="primary">Save</button>
      <button id="btnCancelProfile">Cancel</button>
    </div>
    <div class="msg" id="profileMsg"></div>
  </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://erxndglbywylopckbqjg.supabase.co',
  'sb_publishable_XQQ0k_JJp0u-8q2twD_8Yg_Ve6mn0c4'
)

const $ = id => document.getElementById(id)
const initial = s => (s || '?').charAt(0).toUpperCase()

let me = null
let myProfile = null
let profileCache = {}
let activeRoom = { id: 'general', type: 'channel', label: 'general' }
let chatChannel = null
let friendsChannel = null
let inCall = false
let friendships = []
let pendingAvatarFile = null
let notifyReady = false

// ================= LOADER =================
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    $('loader').classList.add('hide')
    setTimeout(() => {
      $('loader').style.display = 'none'
      // Once loader is done, reveal login if not signed in
      if (!me) $('login').style.display = 'flex'
    }, 700)
  }, 3000)
})

// ================= NOTIFICATIONS =================
async function ensureNotifyPermission() {
  if (!('Notification' in window)) return false
  if (Notification.permission === 'granted') { notifyReady = true; return true }
  if (Notification.permission === 'denied') return false
  const result = await Notification.requestPermission()
  notifyReady = result === 'granted'
  return notifyReady
}

function notify(title, body, tag) {
  if (!notifyReady) return
  if (document.visibilityState === 'visible' && document.hasFocus()) return
  try {
    new Notification(title, {
      body,
      tag,
      icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='16' fill='none' stroke='%23d4cfc6' stroke-width='2'/%3E%3C/svg%3E"
    })
  } catch (e) { console.warn('notify failed', e) }
}

// ================= AUTH =================
$('btnSignin').onclick = async () => {
  $('loginMsg').textContent = ''
  const { error } = await supabase.auth.signInWithPassword({
    email: $('email').value, password: $('pass').value
  })
  if (error) $('loginMsg').textContent = error.message
  else ensureNotifyPermission()
}
$('btnSignup').onclick = async () => {
  $('loginMsg').textContent = ''
  const { error } = await supabase.auth.signUp({
    email: $('email').value, password: $('pass').value
  })
  if (error) $('loginMsg').textContent = error.message
  else ensureNotifyPermission()
}
$('btnSignout').onclick = async () => {
  await cleanupCall()
  await supabase.auth.signOut()
}

supabase.auth.onAuthStateChange((event, session) => {
  if (session?.user) {
    me = session.user
    $('login').style.display = 'none'
    $('app').style.display = 'flex'
    ensureNotifyPermission()
    boot()
  } else {
    me = null; myProfile = null; profileCache = {}
    $('login').style.display = 'flex'
    $('app').style.display = 'none'
    if (chatChannel) { supabase.removeChannel(chatChannel); chatChannel = null }
    if (friendsChannel) { supabase.removeChannel(friendsChannel); friendsChannel = null }
  }
})

// ================= PROFILE =================
async function ensureMyProfile() {
  const { data: existing } = await supabase
    .from('profiles').select('*').eq('id', me.id).maybeSingle()
  if (existing) { myProfile = existing; profileCache[me.email] = existing; return existing }
  const fallbackName = me.email.split('@')[0]
  const { data, error } = await supabase.from('profiles').insert({
    id: me.id, email: me.email, display_name: fallbackName
  }).select().single()
  if (error) { console.error('profile create:', error); return null }
  myProfile = data; profileCache[me.email] = data
  return data
}

async function fetchProfileByEmail(email) {
  if (profileCache[email]) return profileCache[email]
  const { data } = await supabase.from('profiles').select('*').eq('email', email).maybeSingle()
  if (data) profileCache[email] = data
  return data
}

async function loadProfilesFor(emails) {
  const missing = [...new Set(emails)].filter(e => e && !profileCache[e])
  if (missing.length === 0) return
  const { data } = await supabase.from('profiles').select('*').in('email', missing)
  ;(data || []).forEach(p => profileCache[p.email] = p)
}

function renderAvatar(el, profile, fallbackText) {
  el.innerHTML = ''
  if (profile?.avatar_url) {
    const img = document.createElement('img')
    img.src = profile.avatar_url
    el.appendChild(img)
  } else {
    el.textContent = initial(profile?.display_name || fallbackText || '?')
  }
}

function displayNameFor(email) {
  const p = profileCache[email]
  return p?.display_name || email.split('@')[0]
}

function updateMySidebar() {
  if (!myProfile) return
  renderAvatar($('myAvatar'), myProfile, me.email)
  $('myName').textContent = myProfile.display_name || me.email.split('@')[0]
  $('myPronouns').textContent = myProfile.pronouns || 'present'
}

// ================= BOOT =================
async function boot() {
  await ensureMyProfile()
  updateMySidebar()
  renderChannels()
  await loadFriendships()
  listenFriendships()
  openRoom('general', 'channel', 'general')
}

function renderChannels() {
  const el = $('channelList')
  el.innerHTML = ''
  for (const c of ['general', 'random']) {
    const div = document.createElement('div')
    div.className = 'sidebar-item' + (activeRoom.id === c ? ' active' : '')
    div.innerHTML = `<span class="hash">#</span>${c}`
    div.onclick = () => openRoom(c, 'channel', c)
    el.appendChild(div)
  }
}

// ================= FRIENDS =================
async function loadFriendships() {
  const { data, error } = await supabase.from('friendships').select('*')
    .or(`user_a.eq.${me.email},user_b.eq.${me.email}`)
  if (error) { console.error(error); return }
  friendships = data || []
  const emails = friendships.map(f => f.user_a === me.email ? f.user_b : f.user_a)
  await loadProfilesFor(emails)
  renderFriends()
}

function listenFriendships() {
  if (friendsChannel) return
  const myEmail = me.email
  friendsChannel = supabase.channel('friends:' + myEmail)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'friendships' },
      async (payload) => {
        // Notify on new incoming requests
        if (payload.eventType === 'INSERT') {
          const row = payload.new
          if (row.user_b === myEmail && row.requested_by !== myEmail && row.status === 'pending') {
            await fetchProfileByEmail(row.requested_by)
            notify('New Kin Request', `${displayNameFor(row.requested_by)} would like to connect`, 'friend-' + row.id)
          }
        }
        await loadFriendships()
      })
    .subscribe()
}

function renderFriends() {
  const el = $('friendsList')
  el.innerHTML = ''
  if (friendships.length === 0) {
    const empty = document.createElement('div')
    empty.style.cssText = 'color:#4a4640;font-size:12px;padding:10px 14px;letter-spacing:1px'
    empty.textContent = 'no kin yet'
    el.appendChild(empty)
    return
  }
  for (const f of friendships) {
    const other = f.user_a === me.email ? f.user_b : f.user_a
    const isPending = f.status === 'pending' && f.requested_by !== me.email
    const outgoing = f.status === 'pending' && f.requested_by === me.email

    const div = document.createElement('div')
    div.className = 'sidebar-item'
    const avatarBox = document.createElement('div')
    avatarBox.className = 'mini-avatar'
    renderAvatar(avatarBox, profileCache[other], other)
    div.appendChild(avatarBox)
    const nameSpan = document.createElement('span')
    nameSpan.textContent = displayNameFor(other)
    div.appendChild(nameSpan)
    if (isPending) {
      const b = document.createElement('span'); b.className = 'pending'; b.textContent = 'NEW'
      div.appendChild(b)
    } else if (outgoing) {
      const b = document.createElement('span'); b.className = 'pending'
      b.style.opacity = '0.4'; b.textContent = '…'
      div.appendChild(b)
    }

    if (isPending) {
      div.title = 'Click to accept'
      div.onclick = async () => {
        await supabase.from('friendships').update({ status: 'accepted' }).eq('id', f.id)
        await loadFriendships()
      }
    } else if (f.status === 'accepted') {
      const roomId = dmRoomId(me.email, other)
      div.onclick = () => openRoom(roomId, 'dm', other)
    }
    el.appendChild(div)
  }
}

function dmRoomId(a, b) { return 'dm:' + [a, b].sort().join('|') }

$('addFriendBtn').onclick = () => {
  $('friendModal').classList.add('show')
  $('friendMsg').textContent = ''
  $('friendEmail').value = ''
  $('friendEmail').focus()
}
$('btnCloseModal').onclick = () => $('friendModal').classList.remove('show')
$('btnSendRequest').onclick = async () => {
  const target = $('friendEmail').value.trim().toLowerCase()
  if (!target || target === me.email) {
    $('friendMsg').textContent = 'invalid'
    return
  }
  const { error } = await supabase.from('friendships').insert({
    user_a: me.email, user_b: target, status: 'pending', requested_by: me.email
  })
  if (error) $('friendMsg').textContent = error.message
  else {
    $('friendMsg').style.color = 'var(--accent)'
    $('friendMsg').textContent = 'request sent'
    await loadFriendships()
    setTimeout(() => $('friendModal').classList.remove('show'), 800)
  }
}

// ================= CHAT =================
async function openRoom(roomId, type, label) {
  activeRoom = { id: roomId, type, label }
  renderChannels()

  const title = $('channelTitle')
  if (type === 'dm') {
    title.innerHTML = `<span class="hash">@</span>${displayNameFor(label)} <span class="sub">whisper</span>`
  } else {
    title.innerHTML = `<span class="hash">#</span>${label} <span class="sub">chamber</span>`
  }

  if (chatChannel) { await supabase.removeChannel(chatChannel); chatChannel = null }

  const { data } = await supabase.from('messages').select('*')
    .eq('room_id', roomId).order('created_at', { ascending: true }).limit(100)

  const emails = (data || []).map(m => m.user_email)
  await loadProfilesFor(emails)

  $('messages').innerHTML = ''
  ;(data || []).forEach(renderMessage)

  const myEmail = me.email
  chatChannel = supabase.channel('chat:' + roomId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` },
      async ({ new: m }) => {
        if (!profileCache[m.user_email]) await fetchProfileByEmail(m.user_email)
        renderMessage(m)
        if (m.user_email !== myEmail) {
          const roomLabel = type === 'dm' ? 'Whisper' : '#' + label
          notify(
            `${displayNameFor(m.user_email)} · ${roomLabel}`,
            m.content.length > 100 ? m.content.slice(0, 100) + '…' : m.content,
            roomId
          )
        }
      })
    .subscribe()
}

function renderMessage(m) {
  const wrap = document.createElement('div')
  wrap.className = 'msg'

  const avatarDiv = document.createElement('div')
  avatarDiv.className = 'avatar'
  renderAvatar(avatarDiv, profileCache[m.user_email], m.user_email)

  const p = profileCache[m.user_email]
  const t = new Date(m.created_at)
  const time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

  const body = document.createElement('div')
  body.className = 'body'
  body.innerHTML = `
    <div class="meta">
      <span class="name"></span>
      ${p?.pronouns ? '<span class="pronouns"></span>' : ''}
      <span class="time">${time}</span>
    </div>
    <div class="text"></div>
  `
  body.querySelector('.name').textContent = displayNameFor(m.user_email)
  if (p?.pronouns) body.querySelector('.pronouns').textContent = p.pronouns
  body.querySelector('.text').textContent = m.content

  wrap.appendChild(avatarDiv)
  wrap.appendChild(body)
  $('messages').appendChild(wrap)
  $('messages').scrollTop = $('messages').scrollHeight
}

async function sendMessage() {
  if (!me) return
  const text = $('msgInput').value.trim()
  if (!text) return
  $('msgInput').value = ''
  const { error } = await supabase.from('messages').insert({
    room_id: activeRoom.id, content: text, user_email: me.email
  })
  if (error) { alert(error.message); $('msgInput').value = text }
}
$('btnSend').onclick = sendMessage
$('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
})

// ================= PROFILE EDIT =================
function openProfileModal() {
  $('profileModal').classList.add('show')
  $('profileMsg').textContent = ''
  pendingAvatarFile = null
  $('avatarInput').value = ''
  const p = myProfile || {}
  $('pfDisplayName').value = p.display_name || ''
  $('pfPronouns').value = p.pronouns || ''
  $('pfBio').value = p.bio || ''
  renderAvatar($('avatarPreview'), p, me.email)
}
$('btnEditProfile').onclick = openProfileModal
$('myAvatar').onclick = openProfileModal

$('btnCancelProfile').onclick = () => {
  $('profileModal').classList.remove('show')
  pendingAvatarFile = null
}

$('avatarInput').onchange = (e) => {
  const file = e.target.files?.[0]
  if (!file) return
  if (file.size > 5 * 1024 * 1024) {
    $('profileMsg').textContent = 'image too large'
    return
  }
  pendingAvatarFile = file
  const url = URL.createObjectURL(file)
  $('avatarPreview').innerHTML = ''
  const img = document.createElement('img')
  img.src = url
  $('avatarPreview').appendChild(img)
}

$('btnSaveProfile').onclick = async () => {
  $('profileMsg').style.color = 'var(--danger)'
  $('profileMsg').textContent = ''

  let avatar_url = myProfile?.avatar_url || null

  if (pendingAvatarFile) {
    const ext = (pendingAvatarFile.name.split('.').pop() || 'png').toLowerCase()
    const path = `${me.id}/avatar.${ext}`
    const { error: upErr } = await supabase.storage
      .from('avatars')
      .upload(path, pendingAvatarFile, { upsert: true, contentType: pendingAvatarFile.type })
    if (upErr) { $('profileMsg').textContent = 'upload: ' + upErr.message; return }
    const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(path)
    avatar_url = urlData.publicUrl + '?t=' + Date.now()
  }

  const patch = {
    display_name: $('pfDisplayName').value.trim() || null,
    pronouns: $('pfPronouns').value.trim() || null,
    bio: $('pfBio').value.trim() || null,
    avatar_url,
    updated_at: new Date().toISOString()
  }

  const { data, error } = await supabase.from('profiles')
    .update(patch).eq('id', me.id).select().single()
  if (error) { $('profileMsg').textContent = error.message; return }

  myProfile = data
  profileCache[me.email] = data
  updateMySidebar()
  renderFriends()

  $('profileMsg').style.color = 'var(--accent)'
  $('profileMsg').textContent = 'inscribed'
  setTimeout(() => $('profileModal').classList.remove('show'), 700)
}

// ================= CALLING =================
let pc = null, localStream = null, callChannel = null
let audioCtx = null, analyser = null, meterRAF = null
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }

function setCallButtonState(state) {
  inCall = state
  $('btnCall').disabled = state
  $('btnHangup').disabled = !state
  $('btnCall').classList.toggle('active', state)
  $('btnCall').textContent = state ? 'In Call' : 'Begin Call'
}

async function ensureLocalStream() {
  if (localStream) return localStream
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true })
  startMeter(localStream)
  return localStream
}

function startMeter(stream) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
  const src = audioCtx.createMediaStreamSource(stream)
  analyser = audioCtx.createAnalyser()
  analyser.fftSize = 64
  src.connect(analyser)
  const bars = $('meter').children
  const data = new Uint8Array(analyser.frequencyBinCount)
  const tick = () => {
    analyser.getByteFrequencyData(data)
    for (let i = 0; i < bars.length; i++) {
      const v = data[i * 2] || 0
      bars[i].style.height = (5 + (v / 255) * 22) + 'px'
      bars[i].style.background = v > 15 ? 'var(--accent)' : '#2e2b28'
    }
    meterRAF = requestAnimationFrame(tick)
  }
  tick()
}

function stopMeter() {
  if (meterRAF) cancelAnimationFrame(meterRAF)
  meterRAF = null
  for (const b of $('meter').children) { b.style.height = '5px'; b.style.background = '#2e2b28' }
}

function callRoomId() {
  return activeRoom.type === 'dm' ? 'call:' + activeRoom.id : 'call:channel:' + activeRoom.id
}

function createPeer() {
  pc = new RTCPeerConnection(rtcConfig)
  pc.onicecandidate = e => {
    if (e.candidate && callChannel) callChannel.send({
      type: 'broadcast', event: 'ice', payload: e.candidate
    })
  }
  pc.ontrack = e => { $('remoteAudio').srcObject = e.streams[0] }
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') $('btnCall').textContent = 'Connected'
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) cleanupCall()
  }
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream))
  return pc
}

async function joinCallChannel() {
  if (callChannel) await supabase.removeChannel(callChannel)
  const room = activeRoom
  callChannel = supabase.channel(callRoomId(), { config: { broadcast: { self: false } } })

  callChannel
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      // incoming call — notify
      if (!pc) {
        const who = payload.from || 'someone'
        notify('Incoming Call', `${displayNameFor(who)} is calling in ${room.type === 'dm' ? 'a whisper' : '#' + room.label}`, 'call-' + room.id)
        await ensureLocalStream()
        createPeer()
      }
      await pc.setRemoteDescription(payload.sdp)
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)
      callChannel.send({ type: 'broadcast', event: 'answer', payload: { sdp: answer, from: me.email } })
    })
    .on('broadcast', { event: 'answer' }, async ({ payload }) => {
      if (pc && pc.signalingState === 'have-local-offer') {
        await pc.setRemoteDescription(payload.sdp)
      }
    })
    .on('broadcast', { event: 'ice' }, async ({ payload }) => {
      if (pc) { try { await pc.addIceCandidate(payload) } catch (e) {} }
    })
    .on('broadcast', { event: 'hangup' }, () => cleanupCall())
    .subscribe()
}

async function startCall() {
  try {
    await ensureLocalStream()
    await joinCallChannel()
    createPeer()
    const offer = await pc.createOffer()
    await pc.setLocalDescription(offer)
    callChannel.send({ type: 'broadcast', event: 'offer', payload: { sdp: offer, from: me.email } })
    setCallButtonState(true)
  } catch (e) {
    alert('Call failed: ' + e.message)
    console.error(e)
  }
}

async function cleanupCall() {
  try {
    if (callChannel) {
      await callChannel.send({ type: 'broadcast', event: 'hangup', payload: {} })
      await supabase.removeChannel(callChannel)
      callChannel = null
    }
  } catch (e) {}
  if (pc) { pc.close(); pc = null }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null }
  stopMeter()
  $('remoteAudio').srcObject = null
  setCallButtonState(false)
}

$('btnCall').onclick = startCall
$('btnHangup').onclick = cleanupCall
</script>
</body>
</html>
