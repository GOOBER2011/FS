<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>SUN CHAT</title>

<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #050505;
    color: #e8e6e3;
    background-image:
      radial-gradient(circle at 50% -20%, rgba(255, 140, 26, 0.08), transparent 60%),
      radial-gradient(circle at 50% 120%, rgba(255, 200, 60, 0.05), transparent 50%);
  }

  /* ============ SCROLLBARS ============ */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

  /* ============ SUN ICON ============ */
  .sun-icon { display: inline-block; vertical-align: middle; }
  .sun-icon .core { fill: #ffb347; }
  .sun-icon .rays { stroke: #ffb347; stroke-width: 4.5; stroke-linecap: round; }
  .sun-icon.small { width: 20px; height: 20px; }
  .sun-icon.med { width: 32px; height: 32px; }
  .sun-icon.big { width: 56px; height: 56px; filter: drop-shadow(0 0 12px rgba(255, 179, 71, 0.4)); }

  /* ============ LOGIN ============ */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #0f0c08 0%, #000 75%); z-index: 100;
  }
  .login-box {
    background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
    border: 1px solid #2a2218;
    padding: 44px 40px; border-radius: 18px;
    width: 380px; max-width: 90vw;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 179, 71, 0.06) inset;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .login-box::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,179,71,0.5), transparent);
  }
  .login-logo { margin-bottom: 10px; display: flex; justify-content: center; }
  .login-box h1 {
    font-size: 22px; margin-bottom: 6px; letter-spacing: 5px;
    text-transform: uppercase; font-weight: 700;
    background: linear-gradient(180deg, #fff 0%, #ffb347 120%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-box p {
    color: #888; font-size: 12px; margin-bottom: 28px;
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  .login-box input {
    width: 100%; background: #0a0a0a; color: #fff; border: 1px solid #2a2a2a;
    padding: 13px 15px; border-radius: 9px; font-size: 14px; margin-bottom: 10px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .login-box input:focus {
    border-color: #ffb347;
    box-shadow: 0 0 0 3px rgba(255, 179, 71, 0.08);
  }
  .login-box button {
    width: 100%; padding: 13px; border-radius: 9px; border: 1px solid transparent;
    background: linear-gradient(180deg, #ffb347 0%, #e69520 100%);
    color: #1a0f00; font-weight: 700; cursor: pointer; font-size: 14px; margin-top: 4px;
    letter-spacing: 1px; transition: 0.15s;
    box-shadow: 0 4px 16px rgba(255, 179, 71, 0.18);
  }
  .login-box button:hover { filter: brightness(1.08); }
  .login-box button.ghost {
    background: transparent; color: #ffb347; border: 1px solid #3a2e1a; margin-top: 8px;
    box-shadow: none;
  }
  .login-box button.ghost:hover { background: rgba(255, 179, 71, 0.05); border-color: #ffb347; }
  #loginMsg { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-top: 12px; }

  /* ============ APP ============ */
  #app { display: none; height: 100vh; width: 100vw; }
  .sidebar {
    width: 280px;
    background: linear-gradient(180deg, #0b0b0b 0%, #080808 100%);
    border-right: 1px solid #1a1a1a;
    display: flex; flex-direction: column; height: 100%;
    position: relative;
  }
  .sidebar::after {
    content: ''; position: absolute; top: 0; right: -1px; bottom: 0; width: 1px;
    background: linear-gradient(180deg, transparent, rgba(255,179,71,0.15), transparent);
  }
  .sidebar-header {
    padding: 20px 18px; border-bottom: 1px solid #1a1a1a;
    font-weight: 700; font-size: 14px; letter-spacing: 4px; text-transform: uppercase;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, rgba(255,179,71,0.03) 0%, transparent 100%);
  }
  .sidebar-header .brand {
    background: linear-gradient(180deg, #fff 0%, #ffb347 130%);

  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 14px 8px; }

  .section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
    color: #6b5a3e; padding: 14px 12px 8px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-label button {
    background: none; border: 1px solid #2a2a2a; color: #b8a074; cursor: pointer;
    font-size: 14px; line-height: 1; width: 20px; height: 20px; border-radius: 5px;

  .section-label button:hover {

  }
  .sidebar-item.active::before {
    content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px;
    background: #ffb347; border-radius: 0 2px 2px 0;
  }
  .sidebar-item .hash { color: #4a4a4a; font-weight: 700; width: 14px; text-align: center; }
  .sidebar-item.active .hash { color: #ffb347; }
  .sidebar-item .pending {
    font-size: 9px; color: #ff9f43; margin-left: auto;
    border: 1px solid #4a3416; padding: 1px 5px; border-radius: 10px;
    background: rgba(255,159,67,0.08); letter-spacing: 0.5px; font-weight: 700;
  }

  .mini-avatar {
    width: 26px; height: 26px; border-radius: 50%; background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px; overflow: hidden;
    border: 1px solid #2a2a2a; flex-shrink: 0;
  }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .sidebar-item.online .mini-avatar { border-color: rgba(255,179,71,0.3); }

  .user-panel {
    padding: 14px 16px; border-top: 1px solid #1a1a1a;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, transparent, rgba(255,179,71,0.02));
  }
  .user-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; border: 1px solid #2a2a2a;
    overflow: hidden; cursor: pointer; flex-shrink: 0; transition: 0.15s;
  }
  .user-avatar:hover {
    border-color: #ffb347;
    box-shadow: 0 0 0 3px rgba(255,179,71,0.1);
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-panel .info { flex: 1; font-size: 13px; overflow: hidden; min-width: 0; }
  .user-panel .info .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .user-panel .info .sub { color: #6b5a3e; font-size: 11px; }
  .user-panel .icon-btn {
    background: none; border: none; color: #5a5a5a; cursor: pointer;
    font-size: 15px; padding: 6px; border-radius: 6px; transition: 0.15s;
  }
  .user-panel .icon-btn:hover { color: #ffb347; background: rgba(255,179,71,0.05); }

  .main { flex: 1; display: flex; flex-direction: column; height: 100%; background: #050505; }
  .main-header {
    padding: 14px 26px; border-bottom: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, #0b0b0b 0%, #070707 100%);
    min-height: 64px;
  }
  .main-header .title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .main-header .title .hash { color: #ffb347; font-weight: 700; }
  .main-header .sub {
    color: #6b5a3e; font-size: 11px; margin-left: 10px; font-weight: 400;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .call-actions { display: flex; gap: 8px; align-items: center; }
  .call-actions button {
    background: #0d0d0d; border: 1px solid #2a2a2a; color: #dcdcdc;
    padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 13px;
    font-weight: 500; display: flex; align-items: center; gap: 6px;
    transition: 0.15s;
  }
  .call-actions button:hover {
    background: #151515; border-color: #ffb347; color: #ffb347;
  }
  .call-actions button.active {
    background: linear-gradient(180deg, #ffb347, #e69520);
    color: #1a0f00; border-color: transparent; font-weight: 700;
    box-shadow: 0 0 16px rgba(255,179,71,0.3);
  }
  .call-actions button:disabled { opacity: 0.35; cursor: not-allowed; }
  .meter {
    display: flex; gap: 2px; height: 26px; align-items: flex-end;
    background: #0a0a0a; padding: 4px; border-radius: 6px; border: 1px solid #1f1f1f;
  }
  .bar { width: 4px; background: #2a2a2a; border-radius: 1px; height: 4px; }

  .messages { flex: 1; overflow-y: auto; padding: 24px 26px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 14px; }
  .msg .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: #141414;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 15px; border: 1px solid #242424; flex-shrink: 0; overflow: hidden;
    color: #ffb347;
  }
  .msg .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
  .msg .name { font-weight: 600; font-size: 14px; color: #fff; }
  .msg .pronouns {
    font-size: 10px; color: #9a7d4a; letter-spacing: 0.3px;
    padding: 1px 6px; border-radius: 8px; background: rgba(255,179,71,0.06);
    border: 1px solid rgba(255,179,71,0.12);
  }
  .msg .time { font-size: 11px; color: #5a5a5a; }
  .msg .text { color: #d5d0c8; font-size: 14px; line-height: 1.55; word-break: break-word; }

  .composer {
    padding: 14px 26px 20px; border-top: 1px solid #1a1a1a;
    display: flex; gap: 10px;
    background: linear-gradient(180deg, transparent, rgba(255,179,71,0.015));
  }
  .composer input {
    flex: 1; background: #0d0d0d; border: 1px solid #232323; color: #fff;
    padding: 13px 18px; border-radius: 26px; font-size: 14px; outline: none;
    transition: 0.15s;
  }
  .composer input:focus {
    border-color: #ffb347;
    box-shadow: 0 0 0 3px rgba(255,179,71,0.08);
  }
  .composer button {
    background: linear-gradient(180deg, #ffb347 0%, #e69520 100%);
    color: #1a0f00; border: none; padding: 0 24px; border-radius: 26px;
    font-weight: 700; cursor: pointer; font-size: 13px; letter-spacing: 0.5px;
    transition: 0.15s; box-shadow: 0 4px 14px rgba(255,179,71,0.18);
  }
  .composer button:hover { filter: brightness(1.08); }

  /* ============ MODALS ============ */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 90;
    overflow-y: auto; padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
    border: 1px solid #2a2218; padding: 26px;
    border-radius: 16px; width: 460px; max-width: 90vw;
    box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,179,71,0.05) inset;
    position: relative;
  }
  .modal::before {
    content: ''; position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,179,71,0.4), transparent);
  }
  .modal h3 {
    margin-bottom: 18px; font-size: 15px; letter-spacing: 1.5px;
    text-transform: uppercase; color: #ffb347;
  }
  .modal label {
    display: block; font-size: 10px; text-transform: uppercase; color: #7a6a4a;
    margin-bottom: 5px; margin-top: 14px; letter-spacing: 1.2px; font-weight: 600;
  }
  .modal input, .modal textarea {
    width: 100%; background: #0a0a0a; color: #fff; border: 1px solid #262626;
    padding: 11px 13px; border-radius: 9px; font-size: 14px; outline: none;
    font-family: inherit; resize: vertical; transition: 0.15s;
  }
  .modal textarea { min-height: 74px; }
  .modal input:focus, .modal textarea:focus {
    border-color: #ffb347;
    box-shadow: 0 0 0 3px rgba(255,179,71,0.08);
  }
  .modal .row { display: flex; gap: 10px; margin-top: 20px; }
  .modal button {
    padding: 11px 18px; border-radius: 9px; border: 1px solid transparent;
    background: linear-gradient(180deg, #ffb347, #e69520); color: #1a0f00;
    font-weight: 700; cursor: pointer; font-size: 13px; letter-spacing: 0.5px;
    transition: 0.15s;
  }
  .modal button:hover { filter: brightness(1.08); }
  .modal button.ghost {
    background: transparent; color: #b8a074; border: 1px solid #2a2a2a;
  }
  .modal button.ghost:hover { border-color: #ffb347; color: #ffb347; background: rgba(255,179,71,0.04); }
  .modal .msg { font-size: 12px; color: #ff6b6b; min-height: 16px; margin-top: 10px; }

  .avatar-picker { display: flex; align-items: center; gap: 18px; margin-top: 10px; }
  .avatar-preview {
    width: 84px; height: 84px; border-radius: 50%; background: #141414;
    border: 1px solid #2a2a2a; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #ffb347;
    box-shadow: 0 0 0 1px rgba(255,179,71,0.08), 0 0 24px rgba(255,179,71,0.06);
  }
  .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-picker input[type=file] { display: none; }
  .avatar-picker label.pick {
    display: inline-block; padding: 9px 16px; border-radius: 9px;
    border: 1px solid #2a2a2a; cursor: pointer; font-size: 13px;
    color: #b8a074; transition: 0.15s;
  }
  .avatar-picker label.pick:hover {
    border-color: #ffb347; color: #ffb347; background: rgba(255,179,71,0.04);
  }
</style>
</head>
<body>

<!-- ===== SVG ICON ===== -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="sun-symbol" viewBox="0 0 100 100">
    <!-- inner core -->
    <circle cx="50" cy="50" r="17" class="core"/>
    <!-- inner ring with notches (medieval coin style) -->
    <circle cx="50" cy="50" r="22" fill="none" stroke="#ffb347" stroke-width="1.5" opacity="0.6"/>
    <!-- rays -->
    <g class="rays">
      <line x1="50" y1="10" x2="50" y2="22"/>
      <line x1="50" y1="78" x2="50" y2="90"/>
      <line x1="10" y1="50" x2="22" y2="50"/>
      <line x1="78" y1="50" x2="90" y2="50"/>
      <line x1="20" y1="20" x2="29" y2="29"/>
      <line x1="71" y1="71" x2="80" y2="80"/>
      <line x1="20" y1="80" x2="29" y2="71"/>
      <line x1="71" y1="29" x2="80" y2="20"/>
    </g>
    <!-- small accent dots between rays -->
    <g fill="#ffb347" opacity="0.55">
      <circle cx="50" cy="5" r="1.5"/>
      <circle cx="50" cy="95" r="1.5"/>
      <circle cx="5" cy="50" r="1.5"/>
      <circle cx="95" cy="50" r="1.5"/>
    </g>
  </symbol>
</svg>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="login-logo">
      <svg class="sun-icon big" viewBox="0 0 100 100"><use href="#sun-symbol"/></svg>
    </div>
    <h1>Sun Chat</h1>
    <p>Sign in to continue</p>
    <input id="email" type="email" placeholder="email">
    <input id="pass" type="password" placeholder="password">
    <button id="btnSignin">Sign In</button>
    <button id="btnSignup" class="ghost">Create Account</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <svg class="sun-icon small" viewBox="0 0 100 100"><use href="#sun-symbol"/></svg>
      <span class="brand">Sun Chat</span>
    </div>
    <div class="sidebar-scroll">
      <div class="section-label">Channels</div>
      <div id="channelList"></div>
      <div class="section-label">
        Friends
        <button id="addFriendBtn" title="Add friend">+</button>
      </div>
      <div id="friendsList"></div>
    </div>
    <div class="user-panel">
      <div class="user-avatar" id="myAvatar" title="Edit profile">?</div>
      <div class="info">
        <div class="name" id="myName">—</div>
        <div class="sub" id="myPronouns">online</div>
      </div>
      <button class="icon-btn" id="btnEditProfile" title="Edit profile">✎</button>
      <button class="icon-btn" id="btnSignout" title="Sign out">⎋</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div class="title" id="channelTitle"><span class="hash">#</span> general</div>
      <div class="call-actions">
        <div class="meter" id="meter">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <button id="btnCall">📞 Start call</button>
        <button id="btnHangup" disabled>🔇 Hang up</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="msgInput" placeholder="Message...">
      <button id="btnSend">Send</button>
    </div>
  </main>
</div>

<!-- ADD FRIEND MODAL -->
<div class="modal-backdrop" id="friendModal">
  <div class="modal">
    <h3>Add a Friend</h3>
    <input id="friendEmail" placeholder="friend@example.com">
    <div class="row">
      <button id="btnSendRequest">Send Request</button>
      <button id="btnCloseModal" class="ghost">Cancel</button>
    </div>
    <div class="msg" id="friendMsg"></div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal-backdrop" id="profileModal">
  <div class="modal">
    <h3>Edit Profile</h3>
    <label>Profile Picture</label>
    <div class="avatar-picker">
      <div class="avatar-preview" id="avatarPreview">?</div>
      <div>
        <input type="file" id="avatarInput" accept="image/*">
        <label for="avatarInput" class="pick">Choose File</label>
      </div>
    </div>
    <label>Display Name</label>
    <input id="pfDisplayName" placeholder="Your name">
    <label>Pronouns</label>
    <input id="pfPronouns" placeholder="they/them">
    <label>Bio</label>
    <textarea id="pfBio" placeholder="A little about you..."></textarea>
    <div class="row">
      <button id="btnSaveProfile">Save</button>
      <button id="btnCancelProfile" class="ghost">Cancel</button>
    </div>
    <div class="msg" id="profileMsg"></div>
  </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://erxndglbywylopckbqjg.supabase.co',
  'sb_publishable_XQQ0k_JJp0u-8q2twD_8Yg_Ve6mn0c4'
)

const $ = id => document.getElementById(id)
const initial = s => (s || '?').charAt(0).toUpperCase()

let me = null
let myProfile = null
let profileCache = {}
let activeRoom = { id: 'general', type: 'channel', label: 'general' }
let chatChannel = null
let friendsChannel = null
let friendships = []
let pendingAvatarFile = null

// ================= AUTH =================
$('btnSignin').onclick = async () => {
  $('loginMsg').textContent = ''
  const { error } = await supabase.auth.signInWithPassword({
    email: $('email').value, password: $('pass').value
  })
  if (error) $('loginMsg').textContent = error.message
}
$('btnSignup').onclick = async () => {
  $('loginMsg').textContent = ''
  const { error } = await supabase.auth.signUp({
    email: $('email').value, password: $('pass').value
  })
  if (error) $('loginMsg').textContent = error.message
}
$('btnSignout').onclick = async () => {
  await cleanupCall()
  await supabase.auth.signOut()
}

supabase.auth.onAuthStateChange((event, session) => {
  if (session?.user) {
    me = session.user
    $('login').style.display = 'none'
    $('app').style.display = 'flex'
    boot()
  } else {
    me = null; myProfile = null; profileCache = {}
    $('login').style.display = 'flex'
    $('app').style.display = 'none'
    if (chatChannel) { supabase.removeChannel(chatChannel); chatChannel = null }
    if (friendsChannel) { supabase.removeChannel(friendsChannel); friendsChannel = null }
  }
})

// ================= PROFILE =================
async function ensureMyProfile() {
  const { data: existing } = await supabase
    .from('profiles').select('*').eq('id', me.id).maybeSingle()
  if (existing) { myProfile = existing; profileCache[me.email] = existing; return existing }
  const fallbackName = me.email.split('@')[0]
  const { data, error } = await supabase.from('profiles').insert({
    id: me.id, email: me.email, display_name: fallbackName
  }).select().single()
  if (error) { console.error('profile create:', error); return null }
  myProfile = data; profileCache[me.email] = data
  return data
}

async function fetchProfileByEmail(email) {
  if (profileCache[email]) return profileCache[email]
  const { data } = await supabase.from('profiles').select('*').eq('email', email).maybeSingle()
  if (data) profileCache[email] = data
  return data
}

async function loadProfilesFor(emails) {
  const missing = [...new Set(emails)].filter(e => e && !profileCache[e])
  if (missing.length === 0) return
  const { data } = await supabase.from('profiles').select('*').in('email', missing)
  ;(data || []).forEach(p => profileCache[p.email] = p)
}

function renderAvatar(el, profile, fallbackText) {
  el.innerHTML = ''
  if (profile?.avatar_url) {
    const img = document.createElement('img')
    img.src = profile.avatar_url
    el.appendChild(img)
  } else {
    el.textContent = initial(profile?.display_name || fallbackText || '?')
  }
}

function displayNameFor(email) {
  const p = profileCache[email]
  return p?.display_name || email.split('@')[0]
}

function updateMySidebar() {
  if (!myProfile) return
  renderAvatar($('myAvatar'), myProfile, me.email)
  $('myName').textContent = myProfile.display_name || me.email.split('@')[0]
  $('myPronouns').textContent = myProfile.pronouns || 'online'
}

// ================= BOOT =================
async function boot() {
  await ensureMyProfile()
  updateMySidebar()
  renderChannels()
  await loadFriendships()
  listenFriendships()
  openRoom('general', 'channel', 'general')
}

function renderChannels() {
  const el = $('channelList')
  el.innerHTML = ''
  for (const c of ['general', 'random']) {
    const div = document.createElement('div')
    div.className = 'sidebar-item' + (activeRoom.id === c ? ' active' : '')
    div.innerHTML = `<span class="hash">#</span>${c}`
    div.onclick = () => openRoom(c, 'channel', c)
    el.appendChild(div)
  }
}

// ================= FRIENDS =================
async function loadFriendships() {
  const { data, error } = await supabase.from('friendships').select('*')
    .or(`user_a.eq.${me.email},user_b.eq.${me.email}`)
  if (error) { console.error(error); return }
  friendships = data || []
  const emails = friendships.map(f => f.user_a === me.email ? f.user_b : f.user_a)
  await loadProfilesFor(emails)
  renderFriends()
}

function listenFriendships() {
  if (friendsChannel) return
  friendsChannel = supabase.channel('friends:' + me.email)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' },
      () => loadFriendships())
    .subscribe()
}

function renderFriends() {
  const el = $('friendsList')
  el.innerHTML = ''
  if (friendships.length === 0) {
    const empty = document.createElement('div')
    empty.style.cssText = 'color:#4a4a4a;font-size:12px;padding:8px 12px'
    empty.textContent = 'No friends yet — click + to add one'
    el.appendChild(empty)
    return
  }
  for (const f of friendships) {
    const other = f.user_a === me.email ? f.user_b : f.user_a
    const isPending = f.status === 'pending' && f.requested_by !== me.email
    const outgoing = f.status === 'pending' && f.requested_by === me.email

    const div = document.createElement('div')
    div.className = 'sidebar-item online'
    const avatarBox = document.createElement('div')
    avatarBox.className = 'mini-avatar'
    renderAvatar(avatarBox, profileCache[other], other)
    div.appendChild(avatarBox)
    const nameSpan = document.createElement('span')
    nameSpan.textContent = displayNameFor(other)
    div.appendChild(nameSpan)
    if (isPending) {
      const b = document.createElement('span'); b.className = 'pending'; b.textContent = 'NEW'
      div.appendChild(b)
    } else if (outgoing) {
      const b = document.createElement('span'); b.className = 'pending'
      b.style.color = '#555'; b.style.borderColor = '#2a2a2a'; b.style.background = 'transparent'
      b.textContent = '…'
      div.appendChild(b)
    }

    if (isPending) {
      div.title = 'Click to accept friend request'
      div.onclick = async () => {
        await supabase.from('friendships').update({ status: 'accepted' }).eq('id', f.id)
        await loadFriendships()
      }
    } else if (f.status === 'accepted') {
      const roomId = dmRoomId(me.email, other)
      div.onclick = () => openRoom(roomId, 'dm', other)
    }
    el.appendChild(div)
  }
}

function dmRoomId(a, b) { return 'dm:' + [a, b].sort().join('|') }

$('addFriendBtn').onclick = () => {
  $('friendModal').classList.add('show')
  $('friendMsg').textContent = ''
  $('friendEmail').value = ''
  $('friendEmail').focus()
}
$('btnCloseModal').onclick = () => $('friendModal').classList.remove('show')
$('btnSendRequest').onclick = async () => {
  const target = $('friendEmail').value.trim().toLowerCase()
  if (!target || target === me.email) {
    $('friendMsg').textContent = 'Enter a valid email (not your own)'
    return
  }
  const { error } = await supabase.from('friendships').insert({
    user_a: me.email, user_b: target, status: 'pending', requested_by: me.email
  })
  if (error) $('friendMsg').textContent = error.message
  else {
    $('friendMsg').style.color = '#ffb347'
    $('friendMsg').textContent = 'Request sent!'
    await loadFriendships()
    setTimeout(() => $('friendModal').classList.remove('show'), 800)
  }
}

// ================= CHAT =================
async function openRoom(roomId, type, label) {
  activeRoom = { id: roomId, type, label }
  renderChannels()

  const title = $('channelTitle')
  if (type === 'dm') {
    title.innerHTML = `<span class="hash">@</span>${displayNameFor(label)} <span class="sub">direct message</span>`
  } else {
    title.innerHTML = `<span class="hash">#</span>${label} <span class="sub">channel</span>`
  }

  if (chatChannel) { await supabase.removeChannel(chatChannel); chatChannel = null }

  const { data } = await supabase.from('messages').select('*')
    .eq('room_id', roomId).order('created_at', { ascending: true }).limit(100)

  const emails = (data || []).map(m => m.user_email)
  await loadProfilesFor(emails)

  $('messages').innerHTML = ''
  ;(data || []).forEach(renderMessage)

  chatChannel = supabase.channel('chat:' + roomId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` },
      async ({ new: m }) => {
        if (!profileCache[m.user_email]) await fetchProfileByEmail(m.user_email)
        renderMessage(m)
      })
    .subscribe()
}

function renderMessage(m) {
  const wrap = document.createElement('div')
  wrap.className = 'msg'

  const avatarDiv = document.createElement('div')
  avatarDiv.className = 'avatar'
  renderAvatar(avatarDiv, profileCache[m.user_email], m.user_email)

  const p = profileCache[m.user_email]
  const t = new Date(m.created_at)
  const time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

  const body = document.createElement('div')
  body.className = 'body'
  body.innerHTML = `
    <div class="meta">
      <span class="name"></span>
      ${p?.pronouns ? '<span class="pronouns"></span>' : ''}
      <span class="time">${time}</span>
    </div>
    <div class="text"></div>
  `
  body.querySelector('.name').textContent = displayNameFor(m.user_email)
  if (p?.pronouns) body.querySelector('.pronouns').textContent = p.pronouns
  body.querySelector('.text').textContent = m.content

  wrap.appendChild(avatarDiv)
  wrap.appendChild(body)
  $('messages').appendChild(wrap)
  $('messages').scrollTop = $('messages').scrollHeight
}

async function sendMessage() {
  if (!me) return
  const text = $('msgInput').value.trim()
  if (!text) return
  $('msgInput').value = ''
  const { error } = await supabase.from('messages').insert({
    room_id: activeRoom.id, content: text, user_email: me.email
  })
  if (error) { alert(error.message); $('msgInput').value = text }
}
$('btnSend').onclick = sendMessage
$('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
})

// ================= PROFILE EDIT =================
function openProfileModal() {
  $('profileModal').classList.add('show')
  $('profileMsg').textContent = ''
  pendingAvatarFile = null
  $('avatarInput').value = ''
  const p = myProfile || {}
  $('pfDisplayName').value = p.display_name || ''
  $('pfPronouns').value = p.pronouns || ''
  $('pfBio').value = p.bio || ''
  renderAvatar($('avatarPreview'), p, me.email)
}
$('btnEditProfile').onclick = openProfileModal
$('myAvatar').onclick = openProfileModal

$('btnCancelProfile').onclick = () => {
  $('profileModal').classList.remove('show')
  pendingAvatarFile = null
}

$('avatarInput').onchange = (e) => {
  const file = e.target.files?.[0]
  if (!file) return
  if (file.size > 5 * 1024 * 1024) {
    $('profileMsg').textContent = 'Image too large (max 5MB)'
    return
  }
  pendingAvatarFile = file
  const url = URL.createObjectURL(file)
  $('avatarPreview').innerHTML = ''
  const img = document.createElement('img')
  img.src = url
  $('avatarPreview').appendChild(img)
}

$('btnSaveProfile').onclick = async () => {
  $('profileMsg').style.color = '#ff6b6b'
  $('profileMsg').textContent = ''

  let avatar_url = myProfile?.avatar_url || null

  if (pendingAvatarFile) {
    const ext = (pendingAvatarFile.name.split('.').pop() || 'png').toLowerCase()
    const path = `${me.id}/avatar.${ext}`
    const { error: upErr } = await supabase.storage
      .from('avatars')
      .upload(path, pendingAvatarFile, { upsert: true, contentType: pendingAvatarFile.type })
    if (upErr) { $('profileMsg').textContent = 'Upload failed: ' + upErr.message; return }
    const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(path)
    avatar_url = urlData.publicUrl + '?t=' + Date.now()
  }

  const patch = {
    display_name: $('pfDisplayName').value.trim() || null,
    pronouns: $('pfPronouns').value.trim() || null,
    bio: $('pfBio').value.trim() || null,
    avatar_url,
    updated_at: new Date().toISOString()
  }

  const { data, error } = await supabase.from('profiles')
    .update(patch).eq('id', me.id).select().single()
  if (error) { $('profileMsg').textContent = error.message; return }

  myProfile = data
  profileCache[me.email] = data
  updateMySidebar()
  renderFriends()

  $('profileMsg').style.color = '#ffb347'
  $('profileMsg').textContent = 'Saved!'
  setTimeout(() => $('profileModal').classList.remove('show'), 700)
}

// ================= CALLING =================
let pc = null, localStream = null, callChannel = null
let audioCtx = null, analyser = null, meterRAF = null
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }

function setCallButtonState(inCall) {
  $('btnCall').disabled = inCall
  $('btnHangup').disabled = !inCall
  $('btnCall').classList.toggle('active', inCall)
  $('btnCall').textContent = inCall ? '📞 In call' : '📞 Start call'
}

async function ensureLocalStream() {
  if (localStream) return localStream
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true })
  startMeter(localStream)
  return localStream
}

function startMeter(stream) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
  const src = audioCtx.createMediaStreamSource(stream)
  analyser = audioCtx.createAnalyser()
  analyser.fftSize = 64
  src.connect(analyser)
  const bars = $('meter').children
  const data = new Uint8Array(analyser.frequencyBinCount)
  const tick = () => {
    analyser.getByteFrequencyData(data)
    for (let i = 0; i < bars.length; i++) {
      const v = data[i * 2] || 0
      bars[i].style.height = (4 + (v / 255) * 20) + 'px'
      bars[i].style.background = v > 15
        ? `rgb(255, ${Math.round(150 + v * 0.4)}, ${Math.round(60 + v * 0.2)})`
        : '#2a2a2a'
    }
    meterRAF = requestAnimationFrame(tick)
  }
  tick()
}

function stopMeter() {
  if (meterRAF) cancelAnimationFrame(meterRAF)
  meterRAF = null
  for (const b of $('meter').children) { b.style.height = '4px'; b.style.background = '#2a2a2a' }
}

function callRoomId() {
  return activeRoom.type === 'dm' ? 'call:' + activeRoom.id : 'call:channel:' + activeRoom.id
}

function createPeer() {
  pc = new RTCPeerConnection(rtcConfig)
  pc.onicecandidate = e => {
    if (e.candidate && callChannel) callChannel.send({
      type: 'broadcast', event: 'ice', payload: e.candidate
    })
  }
  pc.ontrack = e => { $('remoteAudio').srcObject = e.streams[0] }
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') $('btnCall').textContent = '📞 Connected'
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) cleanupCall()
  }
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream))
  return pc
}

async function joinCallChannel() {
  if (callChannel) await supabase.removeChannel(callChannel)
  callChannel = supabase.channel(callRoomId(), { config: { broadcast: { self: false } } })

  callChannel
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      if (!pc) { await ensureLocalStream(); createPeer() }
      await pc.setRemoteDescription(payload.sdp)
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)
      callChannel.send({ type: 'broadcast', event: 'answer', payload: { sdp: answer } })
    })
    .on('broadcast', { event: 'answer' }, async ({ payload }) => {
      if (pc && pc.signalingState === 'have-local-offer') {
        await pc.setRemoteDescription(payload.sdp)
      }
    })
    .on('broadcast', { event: 'ice' }, async ({ payload }) => {
      if (pc) { try { await pc.addIceCandidate(payload) } catch (e) {} }
    })
    .on('broadcast', { event: 'hangup' }, () => cleanupCall())
    .subscribe()
}

async function startCall() {
  try {
    await ensureLocalStream()
    await joinCallChannel()
    createPeer()
    const offer = await pc.createOffer()
    await pc.setLocalDescription(offer)
    callChannel.send({ type: 'broadcast', event: 'offer', payload: { sdp: offer } })
    setCallButtonState(true)
  } catch (e) {
    alert('Call failed: ' + e.message)
    console.error(e)
  }
}

async function cleanupCall() {
  try {
    if (callChannel) {
      await callChannel.send({ type: 'broadcast', event: 'hangup', payload: {} })
      await supabase.removeChannel(callChannel)
      callChannel = null
    }
  } catch (e) {}
  if (pc) { pc.close(); pc = null }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null }
  stopMeter()
  $('remoteAudio').srcObject = null
  setCallButtonState(false)
}

$('btnCall').onclick = startCall
$('btnHangup').onclick = cleanupCall
</script>
