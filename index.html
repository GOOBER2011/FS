<!DOCTYPE html>
<html>
<head>
    <title>FS Supabase Test</title>
    <style>
        body {
            font-family: monospace;
            background: #0a1526;
            color: #d0e2ff;
            padding: 40px;
            line-height: 1.7;
            font-size: 14px;
        }
        .ok { color: #2ee5a5; }
        .fail { color: #ff7a7a; }
        h1 { color: #4a9eff; }
        pre {
            background: #060d1c;
            padding: 16px;
            border-radius: 10px;
            border-left: 3px solid #2ee5d5;
            overflow-x: auto;
            margin: 12px 0;
        }
        .box {
            background: rgba(10, 25, 45, 0.5);
            padding: 20px;
            border-radius: 12px;
            margin: 16px 0;
            border: 1px solid rgba(120, 180, 255, 0.2);
        }
    </style>
</head>
<body>
    <h1>FS — Supabase connection test</h1>
    <p>This page checks if your browser can reach Supabase.</p>

    <div class="box">
        <strong>Test 1 — raw fetch to health endpoint</strong>
        <pre id="t1">running…</pre>
    </div>

    <div class="box">
        <strong>Test 2 — load supabase-js from CDN</strong>
        <pre id="t2">running…</pre>
    </div>

    <div class="box">
        <strong>Test 3 — sign up test with the client</strong>
        <pre id="t3">waiting for test 2</pre>
    </div>

    <script>
        const URL = 'https://rziozrqkinxmjpqwpdi.supabase.co';
        const KEY = 'sb_publishable_m9kwzBXxhweDmUtREyPhYQ_INo8q_';

        const set = (id, txt, ok) => {
            const el = document.getElementById(id);
            el.textContent = txt;
            el.className = ok === true ? 'ok' : ok === false ? 'fail' : '';
        };

        // ---- Test 1 ----
        (async () => {
            try {
                const res = await fetch(URL + '/auth/v1/health');
                const text = await res.text();
                set('t1', `status: ${res.status}\nbody: ${text}`, res.ok);
            } catch (e) {
                set('t1', `FAILED: ${e.name} — ${e.message}\n\nPossible causes:\n• ad blocker / Brave shields blocking *.supabase.co\n• project paused\n• DNS issue`, false);
            }
        })();

        // ---- Test 2 ----
        (async () => {
            try {
                const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
                set('t2', 'supabase-js loaded OK\ncreateClient = ' + typeof mod.createClient, true);

                // ---- Test 3 ----
                try {
                    const client = mod.createClient(URL, KEY);
                    const email = 'test' + Date.now() + '@example.com';
                    const { data, error } = await client.auth.signUp({ email, password: 'test1234' });
                    if (error) {
                        set('t3', `signUp error:\n${error.message}\n\nstatus: ${error.status || 'n/a'}\ncode: ${error.code || 'n/a'}`, false);
                    } else {
                        set('t3', `signUp OK\nuser: ${data.user?.id || 'none'}\nsession: ${data.session ? 'yes' : 'no'}`, true);
                    }
                } catch (e) {
                    set('t3', `signUp threw: ${e.name} — ${e.message}`, false);
                }
            } catch (e) {
                set('t2', `FAILED: ${e.name} — ${e.message}\n\nCDN is blocked or offline.`, false);
                set('t3', 'skipped (test 2 failed)', false);
            }
        })();
    </script>
</body>
</html>
