<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUN CHAT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='16' fill='none' stroke='%23ffffff' stroke-width='1.5'/%3E%3Cg stroke='%23ffffff' stroke-width='1.2' fill='none' stroke-linecap='round'%3E%3Cpath d='M50 8 Q52 18 50 26'/%3E%3Cpath d='M50 92 Q48 82 50 74'/%3E%3Cpath d='M8 50 Q18 48 26 50'/%3E%3Cpath d='M92 50 Q82 52 74 50'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #000000;
    --bg-2: #0a0a0a;
    --bg-3: #141414;
    --line: #222222;
    --line-2: #333333;
    --line-3: #444444;
    --ink: #ffffff;
    --ink-2: #aaaaaa;
    --ink-3: #666666;
    --ink-4: #444444;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; font-family: var(--mono); }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }

  /* ============ LOADING SCREEN ============ */
  #loader {
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .load-sun {
    margin-bottom: 32px;
    animation: slow-spin 20s linear infinite;
  }
  @keyframes slow-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  #loader .load-title {
    font-family: var(--serif); font-size: 22px;
    letter-spacing: 12px; text-transform: uppercase;
    color: #fff; margin-bottom: 10px;
  }
  #loader .load-sub {
    font-family: var(--serif); font-style: italic;
    font-size: 12px; color: #777; letter-spacing: 0.5px;
  }
  #loader .load-bar {
    margin-top: 36px; width: 200px; height: 1px;
    background: #222; position: relative; overflow: hidden;
  }
  #loader .load-bar::after {
    content: ''; position: absolute; inset: 0;
    background: #fff;
    animation: load-fill 3s cubic-bezier(0.6, 0, 0.4, 1) forwards;
  }
  @keyframes load-fill {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
  }

  /* ============ SUN ICON ============ */
  .sun-icon { display: inline-block; vertical-align: middle; }
  .sun-icon svg { display: block; }
  .sun-svg { stroke: #ffffff; fill: none; stroke-width: 1; }
  .sun-svg .core { fill: none; stroke-width: 1.5; }
  .sun-svg .face { stroke-width: 0.8; opacity: 0.75; }

  /* ============ VERIFIED CHECK ============ */
  .verified {
    display: inline-flex; align-items: center; justify-content: center;
    width: 13px; height: 13px; border-radius: 50%;
    background: #ffffff; color: #000;
    font-size: 9px; font-weight: 700;
    margin-left: 5px; flex-shrink: 0;
    font-family: var(--mono);
    position: relative; top: -1px;
  }
  .verified::after { content: '✓'; line-height: 1; }

  /* ============ LOGIN ============ */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  .login-box {
    background: #000;
    border: 1px solid var(--line-2);
    padding: 56px 48px 46px;
    width: 460px; max-width: 100%;
    box-shadow: 0 40px 100px rgba(0,0,0,0.95);
    text-align: center;
  }
  .login-logo {
    display: flex; justify-content: center; margin-bottom: 22px;
  }
  .login-box .year {
    font-family: var(--mono); font-size: 10px; letter-spacing: 5px;
    color: var(--ink-3); margin-bottom: 22px;
  }
  .login-box h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: 30px; letter-spacing: 14px; margin-bottom: 10px;
    color: #fff; text-transform: uppercase;
  }
  .login-box .tagline {
    font-family: var(--serif); font-style: italic;
    font-size: 13px; color: var(--ink-3); letter-spacing: 0.5px;
    margin-bottom: 36px; line-height: 1.6;
  }
  .login-box .rule {
    height: 1px; background: var(--line); margin: 0 auto 30px; width: 40%;
  }
  .login-box input {
    width: 100%; background: #000; color: #fff;
    border: 1px solid var(--line-2); padding: 13px 16px;
    font-size: 13px; font-family: var(--mono); letter-spacing: 1px;
    margin-bottom: 12px; outline: none; transition: 0.2s;
  }
  .login-box input::placeholder {
    color: var(--ink-3); text-transform: uppercase; font-size: 10px; letter-spacing: 3px;
  }
  .login-box input:focus { border-color: var(--ink-2); }
  .login-box button {
    width: 100%; padding: 14px; border: 1px solid var(--line-2);
    background: transparent; color: #fff;
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 4px; text-transform: uppercase; cursor: pointer;
    margin-top: 6px; transition: 0.2s;
  }
  .login-box button:hover { background: var(--bg-3); border-color: var(--ink-2); }
  .login-box button.primary {
    background: #fff; color: #000; border-color: #fff;
  }
  .login-box button.primary:hover { background: #ddd; }
  #loginMsg {
    font-size: 11px; color: #fff; min-height: 16px;
    margin-top: 14px; letter-spacing: 1px;
  }

  /* ============ APP ============ */
  #app { display: none; height: 100vh; width: 100vw; }
  .sidebar {
    width: 260px; background: #000;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100%;
  }
  .sidebar-header {
    padding: 22px 18px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
  }
  .sidebar-header .brand {
    font-family: var(--serif); font-weight: 400;
    font-size: 15px; letter-spacing: 7px; text-transform: uppercase;
    color: #fff;
  }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 10px 6px; }

  .section-label {
    font-family: var(--mono); font-size: 9px;
    text-transform: uppercase; letter-spacing: 3px;
    color: var(--ink-3); padding: 14px 12px 6px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
    user-select: none;
    transition: 0.15s;
  }
  .section-label:hover { color: var(--ink-2); }
  .section-label .chev {
    font-size: 10px; transition: transform 0.2s;
    margin-right: 4px;
  }
  .section-label.collapsed .chev { transform: rotate(-90deg); }
  .section-label .left {
    display: flex; align-items: center; gap: 6px;
  }
  .section-label button {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    cursor: pointer; font-size: 11px; line-height: 1;
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: var(--mono);
  }
  .section-label button:hover { color: #fff; border-color: var(--ink-2); }
  .section-content { overflow: hidden; transition: max-height 0.2s ease; }
  .section-content.collapsed { max-height: 0 !important; }

  .sidebar-item {
    padding: 8px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 9px; font-size: 12px;
    color: var(--ink-2); margin: 1px 0; transition: 0.15s;
    position: relative;
    border-left: 2px solid transparent;
    border-radius: 4px;
  }
  .sidebar-item:hover { background: var(--bg-3); color: #fff; }
  .sidebar-item.active {
    background: var(--bg-3); color: #fff;
    border-left: 2px solid #fff;
  }
  .sidebar-item .hash {
    color: var(--ink-3); font-family: var(--serif); font-size: 14px;
    width: 14px; text-align: center;
  }
  .sidebar-item.active .hash { color: #fff; }
  .sidebar-item .pending {
    font-size: 8px; color: #fff; margin-left: auto;
    border: 1px solid var(--line-3); padding: 1px 5px;
    letter-spacing: 2px; font-weight: 500;
  }

  .mini-avatar {
    width: 22px; height: 22px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 400; font-size: 10px; overflow: hidden;
    border: 1px solid var(--line-2); flex-shrink: 0;
    color: var(--ink-2); font-family: var(--serif);
    border-radius: 50%;
  }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-panel {
    padding: 12px 14px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    background: #000;
  }
  .user-avatar {
    width: 36px; height: 36px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 400; font-size: 13px;
    border: 1px solid var(--line-2); overflow: hidden;
    cursor: pointer; flex-shrink: 0; transition: 0.2s;
    color: #fff; font-family: var(--serif);
    border-radius: 50%;
  }
  .user-avatar:hover { border-color: var(--ink-2); }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-panel .info { flex: 1; font-size: 11px; overflow: hidden; min-width: 0; }
  .user-panel .info .name {
    font-family: var(--serif); font-size: 13px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.3px;
    display: flex; align-items: center;
  }
  .user-panel .info .sub {
    color: var(--ink-3); font-size: 9px; letter-spacing: 2px;
    text-transform: uppercase; margin-top: 2px;
  }
  .user-panel .icon-btn {
    background: none; border: 1px solid transparent; color: var(--ink-3);
    cursor: pointer; font-size: 13px; padding: 5px 7px; transition: 0.15s;
    font-family: var(--mono);
  }
  .user-panel .icon-btn:hover { color: #fff; border-color: var(--line); }

  .main { flex: 1; display: flex; flex-direction: column; height: 100%; background: #000; }
  .main-header {
    padding: 16px 26px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    background: #000; min-height: 64px;
  }
  .main-header .title {
    font-family: var(--serif); font-size: 17px; font-weight: 400;
    display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px;
    color: #fff;
  }
  .main-header .title .hash { color: #fff; font-size: 19px; }
  .main-header .sub {
    font-family: var(--mono); color: var(--ink-3); font-size: 9px;
    margin-left: 10px; text-transform: uppercase; letter-spacing: 3px;
  }
  .call-actions { display: flex; gap: 8px; align-items: center; }
  .call-actions button {
    background: transparent; border: 1px solid var(--line-2); color: var(--ink-2);
    padding: 9px 16px; cursor: pointer;
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
    transition: 0.15s;
    border-radius: 4px;
  }
  .call-actions button:hover { border-color: var(--ink-2); color: #fff; }
  .call-actions button.active {
    background: #fff; color: #000; border-color: #fff;
  }
  .call-actions button:disabled { opacity: 0.3; cursor: not-allowed; }
  .meter {
    display: flex; gap: 2px; height: 26px; align-items: flex-end;
    background: #000; padding: 4px; border: 1px solid var(--line-2);
    border-radius: 4px;
  }
  .bar { width: 3px; background: #222; height: 4px; border-radius: 1px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 22px 30px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 14px; }
  .msg .avatar {
    width: 38px; height: 38px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; border: 1px solid var(--line-2);
    flex-shrink: 0; overflow: hidden;
    color: #fff; font-family: var(--serif);
    border-radius: 50%;
  }
  .msg .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .meta {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 3px; flex-wrap: wrap;
  }
  .msg .name {
    font-family: var(--serif); font-weight: 400;
    font-size: 13px; color: #fff; letter-spacing: 0.3px;
    display: flex; align-items: center;
  }
  .msg .time {
    font-family: var(--mono); font-size: 9px; color: var(--ink-3);
    letter-spacing: 1px;
  }
  .msg .text {
    color: var(--ink); font-size: 13px; line-height: 1.6;
    word-break: break-word; font-family: var(--mono); font-weight: 300;
  }

  .composer {
    padding: 14px 26px 18px; border-top: 1px solid var(--line);
    display: flex; gap: 10px; background: #000;
  }
  .composer input {
    flex: 1; background: #000; border: 1px solid var(--line-2);
    color: #fff; padding: 12px 16px;
    font-size: 12px; font-family: var(--mono); outline: none;
    letter-spacing: 0.5px; transition: 0.2s; border-radius: 4px;
  }
  .composer input::placeholder {
    color: var(--ink-3); text-transform: uppercase;
    font-size: 10px; letter-spacing: 3px;
  }
  .composer input:focus { border-color: var(--ink-2); }
  .composer button {
    background: #fff; color: #000; border: 1px solid #fff;
    padding: 0 24px; cursor: pointer;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase; transition: 0.15s;
    border-radius: 4px;
  }
  .composer button:hover { background: #ddd; }

  /* ============ MODALS ============ */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 90; overflow-y: auto; padding: 24px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #000; border: 1px solid var(--line-2);
    padding: 28px; width: 440px; max-width: 100%;
    box-shadow: 0 40px 90px rgba(0,0,0,0.95);
  }
  .modal h3 {
    font-family: var(--serif); font-weight: 400;
    font-size: 15px; letter-spacing: 6px;
    text-transform: uppercase; color: #fff;
    margin-bottom: 20px; padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .modal label {
    display: block; font-family: var(--mono);
    font-size: 9px; text-transform: uppercase; color: var(--ink-3);
    margin-bottom: 6px; margin-top: 14px; letter-spacing: 3px;
  }
  .modal input, .modal textarea {
    width: 100%; background: #000; color: #fff;
    border: 1px solid var(--line-2); padding: 10px 12px;
    font-size: 12px; font-family: var(--mono); outline: none;
    resize: vertical; transition: 0.2s; letter-spacing: 0.5px;
    border-radius: 4px;
  }
  .modal textarea { min-height: 72px; }
  .modal input:focus, .modal textarea:focus { border-color: var(--ink-2); }
  .modal .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .modal button {
    padding: 10px 16px; border: 1px solid var(--line-2);
    background: transparent; color: #fff;
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase; cursor: pointer;
    transition: 0.15s; border-radius: 4px;
  }
  .modal button:hover { background: var(--bg-3); border-color: var(--ink-2); }
  .modal button.primary { background: #fff; color: #000; border-color: #fff; }
  .modal button.primary:hover { background: #ddd; }
  .modal .msg {
    font-family: var(--mono); font-size: 10px; color: #fff;
    min-height: 14px; margin-top: 10px; letter-spacing: 1px;
  }

  .avatar-picker { display: flex; align-items: center; gap: 18px; margin-top: 8px; }
  .avatar-preview {
    width: 84px; height: 84px; background: var(--bg-3);
    border: 1px solid var(--line-2); overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff; font-family: var(--serif);
    border-radius: 50%;
  }
  .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-picker input[type=file] { display: none; }
  .avatar-picker label.pick {
    display: inline-block; padding: 10px 16px;
    border: 1px solid var(--line-2); cursor: pointer;
    font-family: var(--mono); font-size: 10px; color: var(--ink-2);
    letter-spacing: 2px; text-transform: uppercase; transition: 0.15s;
    border-radius: 4px;
  }
  .avatar-picker label.pick:hover { color: #fff; border-color: var(--ink-2); }

  /* Verification secret code box */
  .secret-row {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .secret-row input { flex: 1; }
  .secret-row button { padding: 10px 14px; }
</style>
</head>
<body>

<!-- ============ LOADING SCREEN ============ -->
<div id="loader">
  <div class="load-sun">
    <svg width="110" height="110" viewBox="0 0 120 120">
      <g stroke="#ffffff" fill="none" stroke-width="1" stroke-linecap="round">
        <path d="M60 4 Q62 16 60 26"/>

<!-- ============ SUN SVG SYMBOL ============ -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="sun-symbol" viewBox="0 0 120 120">
    <g class="sun-svg">
      <g stroke-linecap="round" fill="none" stroke-width="0.9">
        <path d="M60 4 Q62 16 60 26"/>

        <path d="M4 60 Q16 58 26 60"/>
        <path d="M116 60 Q104 62 94 60"/>

        <path d="M100 100 Q91 90 86 86"/>
        <path d="M20 100 Q29 90 34 86"/>
        <path d="M100 20 Q91 30 86 34"/>
        <path d="M38 10 Q44 20 45 26"/>
        <path d="M82 10 Q76 20 75 26"/>
        <path d="M38 110 Q44 100 45 94"/>
        <path d="M82 110 Q76 100 75 94"/>
        <path d="M10 38 Q20 44 26 45"/>
        <path d="M10 82 Q20 76 26 75"/>
        <path d="M110 38 Q100 44 94 45"/>
        <path d="M110 82 Q100 76 94 75"/>
      </g>

            fill="#fff" opacity="0.9"/>
    </g>
  </symbol>
</svg>

<!-- LOGIN -->
<div id="login" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <svg width="90" height="90" viewBox="0 0 120 120"><use href="#sun-symbol"/></svg>
    </div>
    <div class="year">MMXXV</div>
    <h1>Sun Chat</h1>
    <div class="tagline">a place beneath the light.<br>speak. gather. be counted.</div>
    <div class="rule"></div>
    <input id="email" type="email" placeholder="email">
    <input id="pass" type="password" placeholder="password">
    <button id="btnSignin" class="primary">Enter</button>
    <button id="btnSignup">Create Account</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="brand">Sun Chat</span>
    </div>
    <div class="sidebar-scroll">
      <div class="section-label" data-target="channelList">
        <div class="left"><span class="chev">▾</span>Chambers</div>
      </div>
      <div class="section-content" id="channelList"></div>

      <div class="section-label" data-target="friendsList">
        <div class="left"><span class="chev">▾</span>Kin</div>
        <button id="addFriendBtn" title="Add friend" type="button">+</button>
      </div>
      <div class="section-content" id="friendsList"></div>
    </div>
    <div class="user-panel">
      <div class="user-avatar" id="myAvatar" title="Edit profile">?</div>
      <div class="info">
        <div class="name" id="myName">—</div>
        <div class="sub" id="myPronouns">present</div>

// ================= NOTIFICATIONS =================
async function ensureNotifyPermission() {
  if (!('Notification' in window)) return false
  if (Notification.permission === 'granted') { notifyReady = true; return true }
  if (Notification.permission === 'denied') return false
  const result = await Notification.requestPermission()
  notifyReady = result === 'granted'
  return notifyReady
}

function notify(title, body, tag) {
  if (!notifyReady) return
  if (document.visibilityState === 'visible' && document.hasFocus()) return
  try {
    new Notification(title, {
      body, tag,
      icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='16' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E"
    })
  } catch (e) { console.warn('notify failed', e) }
}

  target.style.maxHeight = target.scrollHeight + 'px'
  label.addEventListener('click', (e) => {
    if (e.target.closest('button')) return // don't toggle when clicking +
    const collapsed = target.classList.toggle('collapsed')
    label.classList.toggle('collapsed', collapsed)

    else target.style.maxHeight = '0px'

})

// ================= PROFILE =================
async function ensureMyProfile() {
  const { data: existing } = await supabase
    .from('profiles').select('*').eq('id', me.id).maybeSingle()
  if (existing) { myProfile = existing; profileCache[me.email] = existing; return existing }
  const fallbackName = me.email.split('@')[0]
  const { data, error } = await supabase.from('profiles').insert({
    id: me.id, email: me.email, display_name: fallbackName, verified: false
  }).select().single()
  if (error) { console.error('profile create:', error); return null }
  myProfile = data; profileCache[me.email] = data
  return data
}

async function fetchProfileByEmail(email) {
  if (profileCache[email]) return profileCache[email]
  const { data } = await supabase.from('profiles').select('*').eq('email', email).maybeSingle()
  if (data) profileCache[email] = data
  return data
}

async function loadProfilesFor(emails) {
  const missing = [...new Set(emails)].filter(e => e && !profileCache[e])
  if (missing.length === 0) return
  const { data } = await supabase.from('profiles').select('*').in('email', missing)
  ;(data || []).forEach(p => profileCache[p.email] = p)
}

function renderAvatar(el, profile, fallbackText) {
  el.innerHTML = ''
  if (profile?.avatar_url) {
    const img = document.createElement('img')
    img.src = profile.avatar_url
    el.appendChild(img)
  } else {
    el.textContent = initial(profile?.display_name || fallbackText || '?')

}

function displayNameFor(email) {
  const p = profileCache[email]
  return p?.display_name || email.split('@')[0]
}

function isVerified(email) {

}

function updateMySidebar() {

async function loadFriendships() {
  const { data, error } = await supabase.from('friendships').select('*')
    .or(`user_a.eq.${me.email},user_b.eq.${me.email}`)
  if (error) { console.error(error); return }
  friendships = data || []
  const emails = friendships.map(f => f.user_a === me.email ? f.user_b : f.user_a)
  await loadProfilesFor(emails)
  renderFriends()
}

function listenFriendships() {
  if (friendsChannel) return
  const myEmail = me.email
  friendsChannel = supabase.channel('friends:' + myEmail)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'friendships' },
      async (payload) => {
        if (payload.eventType === 'INSERT') {
          const row = payload.new
          if (row.user_b === myEmail && row.requested_by !== myEmail && row.status === 'pending') {
            await fetchProfileByEmail(row.requested_by)
            notify('New Kin Request', `${displayNameFor(row.requested_by)} would like to connect`, 'friend-' + row.id)
          }
        }
        await loadFriendships()
      })
    .subscribe()
}

function renderFriends() {

async function openRoom(roomId, type, label) {
  activeRoom = { id: roomId, type, label }

  const title = $('channelTitle')

    title.innerHTML = `<span class="hash">@</span>${displayNameFor(label)} <span class="sub">whisper</span>`

  }

  if (chatChannel) { await supabase.removeChannel(chatChannel); chatChannel = null }

  const { data } = await supabase.from('messages').select('*')
    .eq('room_id', roomId).order('created_at', { ascending: true }).limit(100)

  const emails = (data || []).map(m => m.user_email)
  await loadProfilesFor(emails)

  $('messages').innerHTML = ''
  ;(data || []).forEach(renderMessage)

  const myEmail = me.email
  chatChannel = supabase.channel('chat:' + roomId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` },
      async ({ new: m }) => {
        if (!profileCache[m.user_email]) await fetchProfileByEmail(m.user_email)
        renderMessage(m)
        if (m.user_email !== myEmail) {
          const roomLabel = type === 'dm' ? 'Whisper' : '#' + label
          notify(
            `${displayNameFor(m.user_email)} · ${roomLabel}`,
            m.content.length > 100 ? m.content.slice(0, 100) + '…' : m.content,
            roomId
          )
        }
      })
    .subscribe()
}

// ================= CALLING =================
let pc = null, localStream = null, callChannel = null
let audioCtx = null, analyser = null, meterRAF = null
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }

function setCallButtonState(state) {
  $('btnCall').disabled = state
  $('btnHangup').disabled = !state
  $('btnCall').classList.toggle('active', state)
  $('btnCall').textContent = state ? 'In Call' : 'Begin Call'
}

async function ensureLocalStream() {
  if (localStream) return localStream
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true })
  startMeter(localStream)
  return localStream
}

function startMeter(stream) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
  const src = audioCtx.createMediaStreamSource(stream)
  analyser = audioCtx.createAnalyser()
  analyser.fftSize = 64
  src.connect(analyser)
  const bars = $('meter').children
  const data = new Uint8Array(analyser.frequencyBinCount)
  const tick = () => {
    analyser.getByteFrequencyData(data)
    for (let i = 0; i < bars.length; i++) {
      const v = data[i * 2] || 0
      bars[i].style.height = (4 + (v / 255) * 18) + 'px'
      bars[i].style.background = v > 15 ? '#ffffff' : '#222222'
    }
    meterRAF = requestAnimationFrame(tick)
  }
  tick()
}

function stopMeter() {
  if (meterRAF) cancelAnimationFrame(meterRAF)
  meterRAF = null
  for (const b of $('meter').children) { b.style.height = '4px'; b.style.background = '#222222' }
}

function callRoomId() {
  return activeRoom.type === 'dm' ? 'call:' + activeRoom.id : 'call:channel:' + activeRoom.id
}

function createPeer() {
  pc = new RTCPeerConnection(rtcConfig)
  pc.onicecandidate = e => {
    if (e.candidate && callChannel) callChannel.send({
      type: 'broadcast', event: 'ice', payload: e.candidate
    })
  }
  pc.ontrack = e => { $('remoteAudio').srcObject = e.streams[0] }
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') $('btnCall').textContent = 'Connected'
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) cleanupCall()
  }
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream))
  return pc
}

async function joinCallChannel() {
  if (callChannel) await supabase.removeChannel(callChannel)
  const room = activeRoom
  callChannel = supabase.channel(callRoomId(), { config: { broadcast: { self: false } } })

  callChannel
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      if (!pc) {
        const who = payload.from || 'someone'
        notify('Incoming Call', `${displayNameFor(who)} is calling in ${room.type === 'dm' ? 'a whisper' : '#' + room.label}`, 'call-' + room.id)
        await ensureLocalStream()
        createPeer()
      }
      await pc.setRemoteDescription(payload.sdp)
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)
      callChannel.send({ type: 'broadcast', event: 'answer', payload: { sdp: answer, from: me.email } })
    })
    .on('broadcast', { event: 'answer' }, async ({ payload }) => {
      if (pc && pc.signalingState === 'have-local-offer') {
        await pc.setRemoteDescription(payload.sdp)
      }
    })
    .on('broadcast', { event: 'ice' }, async ({ payload }) => {
      if (pc) { try { await pc.addIceCandidate(payload) } catch (e) {} }
    })
    .on('broadcast', { event: 'hangup' }, () => cleanupCall())
    .subscribe()
}

async function startCall() {
  try {
    await ensureLocalStream()
    await joinCallChannel()
    createPeer()
    const offer = await pc.createOffer()
    await pc.setLocalDescription(offer)
    callChannel.send({ type: 'broadcast', event: 'offer', payload: { sdp: offer, from: me.email } })
    setCallButtonState(true)
  } catch (e) {
    alert('Call failed: ' + e.message)
    console.error(e)
  }
}

async function cleanupCall() {
  try {
    if (callChannel) {
      await callChannel.send({ type: 'broadcast', event: 'hangup', payload: {} })
      await supabase.removeChannel(callChannel)
      callChannel = null
    }
  } catch (e) {}
  if (pc) { pc.close(); pc = null }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null }
  stopMeter()
  $('remoteAudio').srcObject = null
  setCallButtonState(false)
}

$('btnCall').onclick = startCall
$('btnHangup').onclick = cleanupCall
</script>
</body>
</html>
