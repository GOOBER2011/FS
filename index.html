<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Supatest</title></head>
<body>
  <h3>Sign up / Sign in</h3>
  <input id="email" placeholder="email">
  <input id="pass" type="password" placeholder="password">
  <button id="signup">Sign up</button>
  <button id="signin">Sign in</button>

  <h3>Chat</h3>
  <div id="msgs" style="border:1px solid #ccc;height:200px;overflow-y:auto"></div>
  <input id="msg" placeholder="message">
  <button id="send">Send</button>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'PASTE_PROJECT_URL',
  'PASTE_PUBLISHABLE_KEY'
)

signup.onclick = async () => {
  const { error } = await supabase.auth.signUp({
    email: email.value, password: pass.value
  })
  alert(error ? error.message : 'Signed up!')
}
signin.onclick = async () => {
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value, password: pass.value
  })
  alert(error ? error.message : 'Signed in!')
}

async function loadMessages() {
  const { data } = await supabase.from('messages')
    .select('*').order('created_at').limit(50)
  msgs.innerHTML = ''
  data?.forEach(m => msgs.innerHTML += `<div><b>${m.user_email}:</b> ${m.content}</div>`)
  msgs.scrollTop = msgs.scrollHeight
}
loadMessages()

supabase.channel('room')
  .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages' },
      (payload) => {
        const m = payload.new
        msgs.innerHTML += `<div><b>${m.user_email}:</b> ${m.content}</div>`
        msgs.scrollTop = msgs.scrollHeight
      })
  .subscribe()

send.onclick = async () => {
  const { data: { user } } = await supabase.auth.getUser()
  if (!user) return alert('Sign in first')
  const { error } = await supabase.from('messages').insert({
    content: msg.value, user_email: user.email
  })
  if (error) alert(error.message)
  msg.value = ''
}
</script>
</body>
</html>
