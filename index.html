<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUN CHAT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg stroke='%23ffffff' fill='none' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='50' cy='50' r='18'/%3E%3Cpath d='M50 6 Q53 14 50 22'/%3E%3Cpath d='M50 94 Q47 86 50 78'/%3E%3Cpath d='M6 50 Q14 47 22 50'/%3E%3Cpath d='M94 50 Q86 53 78 50'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #000;
    --bg-2: #0a0a0a;
    --bg-3: #141414;
    --line: #1e1e1e;
    --line-2: #2e2e2e;
    --line-3: #444;
    --ink: #fff;
    --ink-2: #aaa;
    --ink-3: #777;
    --ink-4: #4a4a4a;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; font-family: var(--sans); }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

  .ico {
    width: 16px; height: 16px; display: inline-block;
    vertical-align: middle; flex-shrink: 0;
    stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .ico-sm { width: 14px; height: 14px; }
  .ico-lg { width: 20px; height: 20px; }

  #loader {
    position: fixed; inset: 0; z-index: 200; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .load-sun { margin-bottom: 30px; animation: slow-spin 24s linear infinite; }
  @keyframes slow-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  #loader .load-title {
    font-size: 22px; font-weight: 500;
    letter-spacing: 12px; text-transform: uppercase; color: #fff; margin-bottom: 10px;
  }
  #loader .load-sub { font-size: 13px; color: #777; }
  #loader .load-bar {
    margin-top: 32px; width: 200px; height: 1px;
    background: #222; position: relative; overflow: hidden;
  }
  #loader .load-bar::after {
    content: ''; position: absolute; inset: 0; background: #fff;
    animation: load-fill 3s cubic-bezier(0.6, 0, 0.4, 1) forwards;
  }
  @keyframes load-fill { from { transform: translateX(-100%); } to { transform: translateX(0); } }

  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  .login-box {
    background: #000; border: 1px solid var(--line-2);
    padding: 54px 46px 44px; width: 460px; max-width: 100%;
    box-shadow: 0 40px 100px rgba(0,0,0,0.95); text-align: center;
  }
  .login-logo { display: flex; justify-content: center; margin-bottom: 20px; }
  .login-box .year {
    font-size: 11px; letter-spacing: 5px; color: var(--ink-3); margin-bottom: 20px;
  }
  .login-box h1 {
    font-weight: 400; font-size: 30px; letter-spacing: 14px;
    margin-bottom: 12px; color: #fff; text-transform: uppercase;
  }
  .login-box .tagline {
    font-size: 13px; color: var(--ink-3); margin-bottom: 32px; line-height: 1.6;
  }
  .login-box .rule { height: 1px; background: var(--line); margin: 0 auto 28px; width: 40%; }
  .login-box input {
    width: 100%; background: #000; color: #fff;
    border: 1px solid var(--line-2); padding: 13px 16px;
    font-size: 14px; margin-bottom: 12px; outline: none; transition: 0.15s;
    border-radius: 4px;
  }
  .login-box input::placeholder { color: var(--ink-3); font-size: 11px; letter-spacing: 2px; }
  .login-box input:focus { border-color: var(--ink-2); }
  .login-box button {
    width: 100%; padding: 14px; border: 1px solid var(--line-2);
    background: transparent; color: #fff;
    font-size: 12px; font-weight: 500;
    letter-spacing: 4px; text-transform: uppercase;
    cursor: pointer; margin-top: 6px; transition: 0.15s;
    border-radius: 4px;
  }
  .login-box button:hover { background: var(--bg-3); border-color: var(--ink-2); }
  .login-box button.primary { background: #fff; color: #000; border-color: #fff; }
  .login-box button.primary:hover { background: #ddd; }
  #loginMsg { font-size: 12px; min-height: 16px; margin-top: 14px; }

  #app { display: none; height: 100vh; width: 100vw; }
  .sidebar {
    width: 240px; background: #000; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100%;
    transition: width 0.2s ease; overflow: hidden; flex-shrink: 0;
  }
  .sidebar.collapsed { width: 48px; }
  .sidebar-header {
    padding: 18px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    min-height: 58px;
  }
  .sidebar-header .brand {
    font-weight: 500; font-size: 15px; letter-spacing: 5px;
    text-transform: uppercase; color: #fff; white-space: nowrap;
  }
  .sidebar.collapsed .brand { display: none; }
  .sidebar-toggle {
    background: none; border: none; color: var(--ink-3);
    cursor: pointer; padding: 4px; transition: 0.15s; flex-shrink: 0;
  }
  .sidebar-toggle:hover { color: #fff; }

  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 10px 6px; }
  .sidebar.collapsed .sidebar-scroll { padding: 10px 4px; }
  .sidebar.collapsed .section-label,
  .sidebar.collapsed .section-content { display: none; }

  .section-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2px;
    color: var(--ink-3); padding: 12px 10px 6px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
  }
  .section-label .left { display: flex; align-items: center; gap: 6px; }
  .section-label .chev { font-size: 10px; transition: transform 0.2s; }
  .section-label.collapsed .chev { transform: rotate(-90deg); }
  .section-label button {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    cursor: pointer; font-size: 12px; line-height: 1;
    width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    border-radius: 3px;
  }
  .section-label button:hover { color: #fff; border-color: var(--ink-2); }
  .section-content { overflow: hidden; transition: max-height 0.2s ease; }

  .sidebar-item {
    padding: 8px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    color: var(--ink-2); margin: 1px 0; transition: 0.12s;
    border-left: 2px solid transparent; border-radius: 3px;
    position: relative; white-space: nowrap; overflow: hidden;
  }
  .sidebar-item:hover { background: var(--bg-3); color: #fff; }
  .sidebar-item.active { background: var(--bg-3); color: #fff; border-left-color: #fff; }
  .sidebar-item .hash { color: var(--ink-3); font-size: 14px; width: 12px; text-align: center; font-weight: 500; }
  .sidebar-item.active .hash { color: #fff; }
  .sidebar-item .pending {
    font-size: 9px; color: #fff; margin-left: auto;
    border: 1px solid var(--line-3); padding: 1px 5px;
    letter-spacing: 1px; border-radius: 3px;
  }
  .sidebar.collapsed .sidebar-item .label-text,
  .sidebar.collapsed .sidebar-item .pending,
  .sidebar.collapsed .sidebar-item .verified,
  .sidebar.collapsed .sidebar-item .user-tag { display: none; }
  .sidebar.collapsed .sidebar-item { justify-content: center; padding: 8px 4px; }

  .mini-avatar {
    width: 22px; height: 22px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; overflow: hidden;
    border: 1px solid var(--line-2); flex-shrink: 0;
    color: var(--ink-2); font-weight: 500; border-radius: 50%;
  }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-panel {
    padding: 10px 12px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; background: #000;
  }
  .sidebar.collapsed .user-panel { flex-direction: column; padding: 10px 4px; gap: 6px; }
  .sidebar.collapsed .user-panel .info,
  .sidebar.collapsed .user-panel .icon-btn { display: none; }
  .user-avatar {
    width: 34px; height: 34px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--line-2);
    overflow: hidden; cursor: pointer; flex-shrink: 0;
    color: #fff; border-radius: 50%;
  }
  .user-avatar:hover { border-color: var(--ink-2); }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-panel .info { flex: 1; font-size: 12px; overflow: hidden; min-width: 0; }
  .user-panel .info .name {
    font-size: 13px; font-weight: 600; color: #fff;
    display: flex; align-items: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .user-panel .info .sub {
    color: var(--ink-3); font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; margin-top: 2px;
  }
  .user-panel .icon-btn {
    background: none; border: none; color: var(--ink-3);
    cursor: pointer; padding: 4px; transition: 0.15s;
    display: flex; align-items: center;
  }
  .user-panel .icon-btn:hover { color: #fff; }

  .main { flex: 1; display: flex; flex-direction: row; height: 100%; min-width: 0; }
  .chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .main-header {
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    background: #000; min-height: 60px;
  }
  .main-header .title {
    font-size: 16px; font-weight: 500;
    display: flex; align-items: center; gap: 6px; color: #fff;
  }
  .main-header .title .hash { color: #fff; font-size: 18px; }
  .main-header .sub {
    color: var(--ink-3); font-size: 11px;
    margin-left: 8px; text-transform: uppercase; letter-spacing: 2px;
  }
  .call-actions { display: flex; gap: 6px; align-items: center; }
  .call-actions button {
    background: transparent; border: 1px solid var(--line-2); color: var(--ink-2);
    padding: 8px 14px; cursor: pointer; font-size: 11px; font-weight: 500;
    letter-spacing: 1px; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
    transition: 0.15s; border-radius: 4px;
  }
  .call-actions button:hover { border-color: var(--ink-2); color: #fff; }
  .call-actions button.active { background: #fff; color: #000; border-color: #fff; }
  .call-actions button:disabled { opacity: 0.3; cursor: not-allowed; }
  .meter {
    display: flex; gap: 2px; height: 24px; align-items: flex-end;
    background: #000; padding: 3px; border: 1px solid var(--line-2); border-radius: 4px;
  }
  .bar { width: 3px; background: #222; height: 3px; border-radius: 1px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 20px 28px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    display: flex; gap: 12px; padding: 6px 8px;
    border-radius: 4px; position: relative;
    transition: background 0.12s;
  }
  .msg:hover { background: #0a0a0a; }
  .msg .avatar {
    width: 36px; height: 36px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500; border: 1px solid var(--line-2);
    flex-shrink: 0; overflow: hidden;
    color: #fff; border-radius: 50%;
  }
  .msg .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .meta {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 3px; flex-wrap: wrap;
  }
  .msg .name {
    font-size: 14px; font-weight: 600; color: #fff;
    display: flex; align-items: center;
  }
  .msg .time { font-size: 11px; color: var(--ink-3); }
  .msg .text {
    color: var(--ink); font-size: 14px; line-height: 1.6;
    word-break: break-word; font-weight: 400;
  }
  .msg.deleted .text { color: var(--ink-4); font-style: italic; }

  .user-tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    border: 1px solid var(--line-3);
    border-radius: 3px;
    color: var(--ink-2);
    text-transform: uppercase;
    line-height: 1.3;
    position: relative;
    top: -1px;
  }

  .msg .reply-context {
    border-left: 2px solid var(--line-3);
    padding: 3px 8px; margin-bottom: 5px;
    font-size: 12px; color: var(--ink-3);
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .msg .reply-context .who { color: #fff; font-weight: 500; }

  .msg .reactions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .reaction-pill {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--line-2); border-radius: 12px;
    padding: 3px 8px; font-size: 11px; font-weight: 500; color: var(--ink-2);
    cursor: pointer; transition: 0.12s; background: #000;
    user-select: none;
  }
  .reaction-pill:hover { border-color: var(--ink-2); color: #fff; }
  .reaction-pill.mine { border-color: #fff; color: #fff; background: var(--bg-3); }
  .reaction-pill .rc { font-size: 11px; }
  .reaction-pill svg { width: 13px; height: 13px; }

  .msg .msg-actions {
    position: absolute; top: -10px; right: 8px;
    display: none; gap: 2px;
    background: #0a0a0a; border: 1px solid var(--line-2);
    border-radius: 5px; padding: 3px;
  }
  .msg:hover .msg-actions { display: flex; }
  .msg-actions button {
    background: none; border: none; cursor: pointer;
    color: var(--ink-2); padding: 4px 5px; border-radius: 3px;
    display: flex; align-items: center;
  }
  .msg-actions button:hover { color: #fff; background: var(--bg-3); }

  .reaction-picker {
    position: fixed; z-index: 80;
    background: #0a0a0a; border: 1px solid var(--line-2);
    padding: 6px; border-radius: 6px;
    display: none; gap: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .reaction-picker.show { display: flex; }
  .reaction-picker button {
    background: none; border: none; cursor: pointer;
    padding: 5px 6px; border-radius: 4px; color: var(--ink-2);
    display: flex; align-items: center;
  }
  .reaction-picker button:hover { background: var(--bg-3); color: #fff; }

  .composer {
    padding: 12px 22px 16px; border-top: 1px solid var(--line);
    background: #000;
  }
  .composer .reply-banner {
    display: none; padding: 8px 12px; margin-bottom: 8px;
    border-left: 2px solid var(--line-3); font-size: 12px;
    color: var(--ink-3); background: #0a0a0a; border-radius: 3px;
    justify-content: space-between; align-items: center;
  }
  .composer .reply-banner.show { display: flex; }
  .composer .reply-banner .rb-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .composer .reply-banner .who { color: #fff; font-weight: 600; }
  .composer .reply-banner button {
    background: none; border: none; color: var(--ink-3);
    cursor: pointer; padding: 2px 6px;
  }
  .composer .reply-banner button:hover { color: #fff; }

  .attach-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    margin-bottom: 8px;
    background: #0a0a0a;
    border: 1px solid var(--line-2);
    border-radius: 4px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .attach-bar.show { display: flex; }
  .attach-bar button {
    background: none; border: none; color: var(--ink-3);
    cursor: pointer; padding: 2px 6px;
  }
  .attach-bar button:hover { color: #fff; }
  .attach-bar .preview-mini { max-height: 40px; border-radius: 3px; }
  .attach-bar .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .composer .input-row { display: flex; gap: 10px; align-items: center; }
  .composer input[type="text"] {
    flex: 1; background: #000; border: 1px solid var(--line-2);
    color: #fff; padding: 12px 16px;
    font-size: 14px; outline: none; border-radius: 4px;
    transition: 0.15s;
  }
  .composer input[type="text"]::placeholder {
    color: var(--ink-3); font-size: 12px; letter-spacing: 1px;
  }
  .composer input[type="text"]:focus { border-color: var(--ink-2); }
  .composer button.send {
    background: #fff; color: #000; border: 1px solid #fff;
    padding: 12px 22px; cursor: pointer; font-size: 12px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    border-radius: 4px; display: flex; align-items: center; gap: 6px;
  }
  .composer button.send:hover { background: #ddd; }

  .icon-btn-attach {
    background: none; border: 1px solid var(--line-2); color: var(--ink-2);
    width: 42px; height: 42px; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn-attach:hover { color: #fff; border-color: var(--ink-2); }
  .icon-btn-attach.recording { background: #fff; color: #000; border-color: #fff; }

  .attach-preview {
    margin-top: 6px;
    max-width: 320px;
    border: 1px solid var(--line-2);
    border-radius: 6px;
    overflow: hidden;
  }
  .attach-preview img,
  .attach-preview video {
    display: block; width: 100%; height: auto;
  }
  .attach-preview audio {
    display: block; width: 100%;
    filter: invert(1) hue-rotate(180deg);
  }

  .profile-panel {
    width: 0; background: #000; border-left: 1px solid var(--line);
    overflow: hidden; transition: width 0.2s ease; flex-shrink: 0;
  }
  .profile-panel.open { width: 280px; }
  .profile-inner {
    width: 280px; padding: 24px 20px;
    display: flex; flex-direction: column;
  }
  .profile-close {
    align-self: flex-end; background: none; border: none;
    color: var(--ink-3); cursor: pointer; padding: 4px;
    margin-bottom: 4px;
  }
  .profile-close:hover { color: #fff; }
  .profile-pic {
    width: 96px; height: 96px; border-radius: 50%;
    background: var(--bg-3); border: 1px solid var(--line-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 500; color: #fff;
    overflow: hidden; margin: 0 auto 16px;
  }
  .profile-pic img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name {
    font-size: 18px; font-weight: 600; color: #fff;
    text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 4px;
  }
  .profile-pronouns {
    font-size: 11px; color: var(--ink-3);
    text-align: center; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 20px;
  }
  .profile-section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .profile-section-label {
    font-size: 10px; font-weight: 600; color: var(--ink-3); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .profile-bio {
    font-size: 13px; color: var(--ink-2); line-height: 1.6;
    word-break: break-word;
  }
  .profile-bio.empty { color: var(--ink-4); font-style: italic; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 90; overflow-y: auto; padding: 24px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #000; border: 1px solid var(--line-2);
    padding: 26px; width: 460px; max-width: 100%;
    box-shadow: 0 40px 90px rgba(0,0,0,0.95);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 {
    font-weight: 500; font-size: 16px; letter-spacing: 5px;
    text-transform: uppercase; color: #fff;
    margin-bottom: 20px; padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .modal label {
    display: block; font-size: 10px; font-weight: 600;
    text-transform: uppercase; color: var(--ink-3);
    margin-bottom: 6px; margin-top: 14px; letter-spacing: 2px;
  }
  .modal input, .modal textarea {
    width: 100%; background: #000; color: #fff;
    border: 1px solid var(--line-2); padding: 11px 13px;
    font-size: 14px; outline: none; resize: vertical;
    border-radius: 4px; transition: 0.15s;
  }
  .modal textarea { min-height: 80px; }
  .modal input:focus, .modal textarea:focus { border-color: var(--ink-2); }
  .modal .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .modal button {
    padding: 11px 18px; border: 1px solid var(--line-2);
    background: transparent; color: #fff;
    font-size: 12px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; border-radius: 4px; transition: 0.15s;
  }
  .modal button:hover { background: var(--bg-3); border-color: var(--ink-2); }
  .modal button.primary { background: #fff; color: #000; border-color: #fff; }
  .modal button.primary:hover { background: #ddd; }
  .modal .msg { font-size: 12px; min-height: 16px; margin-top: 10px; }

  .avatar-picker { display: flex; align-items: center; gap: 18px; margin-top: 8px; }
  .avatar-preview {
    width: 84px; height: 84px; background: var(--bg-3);
    border: 1px solid var(--line-2); overflow: hidden;

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(

const $ = id => document.getElementById(id)
const initial = s => (s || '?').charAt(0).toUpperCase()
const ADMIN_CODE = 'googoogaga'

const REACTIONS = {
  thumb: 'i-thumb', heart: 'i-heart', laugh: 'i-laugh',
  sad: 'i-sad', fire: 'i-fire', star: 'i-star'

let me = null
let myProfile = null
let profileCache = {}

let messagesCache = {}
let pendingAvatarFile = null

let openPickerFor = null
let pendingAttachment = null

let recordedChunks = []

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    $('loader').classList.add('hide')
    setTimeout(() => {
      $('loader').style.display = 'none'
      if (!me) $('login').style.display = 'flex'
    }, 700)
  }, 3000)
})

$('sidebarToggle').onclick = () => $('sidebar').classList.toggle('collapsed')

document.querySelectorAll('.section-label[data-target]').forEach(label => {
  const targetId = label.dataset.target
  const target = document.getElementById(targetId)
  if (!target) return
  target.style.maxHeight = target.scrollHeight + 'px'
  label.addEventListener('click', (e) => {
    if (e.target.closest('button')) return
    const collapsed = target.classList.toggle('collapsed')
    label.classList.toggle('collapsed', collapsed)
    target.style.maxHeight = collapsed ? '0px' : target.scrollHeight + 'px'
  })
})

function resizeSection(id) {
  const el = document.getElementById(id)
  if (el && !el.classList.contains('collapsed')) {
    el.style.maxHeight = el.scrollHeight + 'px'
  }
}

async function ensureNotifyPermission() {
  if (!('Notification' in window)) return false
  if (Notification.permission === 'granted') { notifyReady = true; return true }
  if (Notification.permission === 'denied') return false
  const r = await Notification.requestPermission()
  notifyReady = r === 'granted'
  return notifyReady
}
function notify(title, body, tag) {
  if (!notifyReady) return
  if (document.visibilityState === 'visible' && document.hasFocus()) return
  try { new Notification(title, { body, tag }) } catch (e) {}
}

$('btnSignin').onclick = async () => {
  $('loginMsg').textContent = ''
  const { error } = await supabase.auth.signInWithPassword({
    email: $('email').value, password: $('pass').value
  })
  if (error) $('loginMsg').textContent = error.message
  else ensureNotifyPermission()
}
$('btnSignup').onclick = async () => {
  $('loginMsg').textContent = ''
  const { error } = await supabase.auth.signUp({
    email: $('email').value, password: $('pass').value
  })
  if (error) $('loginMsg').textContent = error.message
  else ensureNotifyPermission()
}
$('btnSignout').onclick = async () => {
  await cleanupCall()
  await supabase.auth.signOut()
}

supabase.auth.onAuthStateChange((event, session) => {
  if (session?.user) {
    me = session.user
    $('login').style.display = 'none'
    $('app').style.display = 'flex'
    ensureNotifyPermission()
    boot()
  } else {
    me = null; myProfile = null; profileCache = {}; messagesCache = {}
    $('login').style.display = 'flex'
    $('app').style.display = 'none'
    if (chatChannel) { supabase.removeChannel(chatChannel); chatChannel = null }
    if (friendsChannel) { supabase.removeChannel(friendsChannel); friendsChannel = null }
  }
})

async function ensureMyProfile() {
  const { data: existing } = await supabase
    .from('profiles').select('*').eq('id', me.id).maybeSingle()
  if (existing) { myProfile = existing; profileCache[me.email] = existing; return existing }
  const fallbackName = me.email.split('@')[0]
  const { data, error } = await supabase.from('profiles').insert({
    id: me.id, email: me.email, display_name: fallbackName, verified: false
  }).select().single()
  if (error) { console.error(error); return null }
  myProfile = data; profileCache[me.email] = data
  return data
}
async function fetchProfileByEmail(email) {
  if (profileCache[email]) return profileCache[email]
  const { data } = await supabase.from('profiles').select('*').eq('email', email).maybeSingle()
  if (data) profileCache[email] = data
  return data
}
async function loadProfilesFor(emails) {
  const missing = [...new Set(emails)].filter(e => e && !profileCache[e])
  if (missing.length === 0) return
  const { data } = await supabase.from('profiles').select('*').in('email', missing)
  ;(data || []).forEach(p => profileCache[p.email] = p)
}
function renderAvatar(el, profile, fallbackText) {
  el.innerHTML = ''
  if (profile?.avatar_url) {
    const img = document.createElement('img')
    img.src = profile.avatar_url
    el.appendChild(img)
  } else {
    el.textContent = initial(profile?.display_name || fallbackText || '?')
  }
}
function displayNameFor(email) {
  const p = profileCache[email]
  return p?.display_name || email.split('@')[0]
}
function isVerified(email) { return !!profileCache[email]?.verified }
function makeVerifiedBadge() {
  const span = document.createElement('span')
  span.className = 'verified'
  span.title = 'Verified'
  span.innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-check"/></svg>'
  return span
}
function makeTag(profile) {
  if (!profile?.tag_text) return null
  const tag = document.createElement('span')
  tag.className = 'user-tag'
  tag.textContent = profile.tag_text
  if (profile.tag_color) {
    tag.style.color = profile.tag_color
    tag.style.borderColor = profile.tag_color
  }
  return tag
}
function updateMySidebar() {
  if (!myProfile) return
  renderAvatar($('myAvatar'), myProfile, me.email)
  const nameEl = $('myName')
  nameEl.innerHTML = ''
  nameEl.appendChild(document.createTextNode(myProfile.display_name || me.email.split('@')[0]))
  if (myProfile.verified) nameEl.appendChild(makeVerifiedBadge())
  if (myProfile.name_color) nameEl.style.color = myProfile.name_color
  $('myPronouns').textContent = myProfile.pronouns || 'present'
}

async function boot() {
  await ensureMyProfile()
  updateMySidebar()
  renderChannels()
  await loadFriendships()
  listenFriendships()
  openRoom('general', 'channel', 'general')
}
function renderChannels() {
  const el = $('channelList')
  el.innerHTML = ''
  for (const c of ['general', 'random']) {
    const div = document.createElement('div')
    div.className = 'sidebar-item' + (activeRoom.id === c ? ' active' : '')
    div.innerHTML = `<span class="hash">#</span><span class="label-text">${c}</span>`
    div.onclick = () => openRoom(c, 'channel', c)
    el.appendChild(div)
  }
  resizeSection('channelList')
}

async function loadFriendships() {
  const { data, error } = await supabase.from('friendships').select('*')
    .or(`user_a.eq.${me.email},user_b.eq.${me.email}`)
  if (error) { console.error(error); return }
  friendships = data || []
  const emails = friendships.map(f => f.user_a === me.email ? f.user_b : f.user_a)
  await loadProfilesFor(emails)
  renderFriends()
}
function listenFriendships() {
  if (friendsChannel) return
  const myEmail = me.email
  friendsChannel = supabase.channel('friends:' + myEmail)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'friendships' },
      async (payload) => {
        if (payload.eventType === 'INSERT') {
          const row = payload.new
          if (row.user_b === myEmail && row.requested_by !== myEmail && row.status === 'pending') {
            await fetchProfileByEmail(row.requested_by)
            notify('New Kin Request', `${displayNameFor(row.requested_by)} would like to connect`, 'friend-' + row.id)
          }
        }
        await loadFriendships()
      })
    .subscribe()
}
function renderFriends() {
  const el = $('friendsList')
  el.innerHTML = ''
  if (friendships.length === 0) {
    const empty = document.createElement('div')
    empty.style.cssText = 'color:#444;font-size:12px;padding:8px 12px'
    empty.textContent = 'no kin yet'
    el.appendChild(empty)
  } else {
    for (const f of friendships) {
      const other = f.user_a === me.email ? f.user_b : f.user_a
      const isPending = f.status === 'pending' && f.requested_by !== me.email
      const outgoing = f.status === 'pending' && f.requested_by === me.email

      const div = document.createElement('div')
      div.className = 'sidebar-item'

      const avatarBox = document.createElement('div')
      avatarBox.className = 'mini-avatar'
      renderAvatar(avatarBox, profileCache[other], other)
      div.appendChild(avatarBox)

      const label = document.createElement('span')
      label.className = 'label-text'
      label.textContent = displayNameFor(other)
      const prof = profileCache[other]
      if (prof?.name_color) label.style.color = prof.name_color
      div.appendChild(label)

      if (isVerified(other)) div.appendChild(makeVerifiedBadge())
      const tag = makeTag(prof)
      if (tag) div.appendChild(tag)

      if (isPending) {
        const b = document.createElement('span'); b.className = 'pending'; b.textContent = 'NEW'
        div.appendChild(b)
      } else if (outgoing) {
        const b = document.createElement('span'); b.className = 'pending'
        b.style.opacity = '0.4'; b.textContent = '…'
        div.appendChild(b)
      }

      if (isPending) {
        div.title = 'Click to accept'
        div.onclick = async () => {
          await supabase.from('friendships').update({ status: 'accepted' }).eq('id', f.id)
          await loadFriendships()
        }
      } else if (f.status === 'accepted') {
        const roomId = dmRoomId(me.email, other)
        div.onclick = () => openRoom(roomId, 'dm', other)
      }
      el.appendChild(div)
    }
  }
  resizeSection('friendsList')
}

async function openRoom(roomId, type, label) {
  activeRoom = { id: roomId, type, label }
  renderChannels()
  closeProfilePanel()

  const title = $('channelTitle')
  if (type === 'dm') {
    title.innerHTML = `<span class="hash">@</span>${displayNameFor(label)} <span class="sub">whisper</span>`
    if (isVerified(label)) title.appendChild(makeVerifiedBadge())
    const prof = profileCache[label]
    const tag = makeTag(prof)
    if (tag) title.appendChild(tag)
    openProfilePanel(label)
  } else {
    title.innerHTML = `<span class="hash">#</span>${label} <span class="sub">chamber</span>`
  }

  clearReply()
  clearPendingAttachment()
  if (chatChannel) { await supabase.removeChannel(chatChannel); chatChannel = null }
  messagesCache = {}

  const { data } = await supabase.from('messages').select('*')
    .eq('room_id', roomId).order('created_at', { ascending: true }).limit(100)

  const emails = (data || []).map(m => m.user_email)
  await loadProfilesFor(emails)

  $('messages').innerHTML = ''
  ;(data || []).forEach(m => { messagesCache[m.id] = m; renderMessage(m) })

  const myEmail = me.email
  chatChannel = supabase.channel('chat:' + roomId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` },
      async ({ new: m }) => {
        if (!profileCache[m.user_email]) await fetchProfileByEmail(m.user_email)
        messagesCache[m.id] = m
        renderMessage(m)
        if (m.user_email !== myEmail) {
          const roomLabel = type === 'dm' ? 'Whisper' : '#' + label
          const preview = m.content || (m.attachment_type === 'image' ? 'sent an image' : 'sent a voice message')
          notify(`${displayNameFor(m.user_email)} · ${roomLabel}`,
            preview.length > 100 ? preview.slice(0, 100) + '…' : preview, roomId)
        }
      })
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` },
      ({ new: m }) => {
        messagesCache[m.id] = m
        const existing = document.querySelector(`.msg[data-id="${m.id}"]`)
        if (existing) existing.replaceWith(buildMessageEl(m))
      })
    .subscribe()
}

function buildMessageEl(m) {
  const wrap = document.createElement('div')
  wrap.className = 'msg' + (m.deleted ? ' deleted' : '')
  wrap.dataset.id = m.id

  if (m.reply_to && messagesCache[m.reply_to]) {
    const parent = messagesCache[m.reply_to]
    const ctx = document.createElement('div')
    ctx.className = 'reply-context'
    const who = document.createElement('span')
    who.className = 'who'
    who.textContent = displayNameFor(parent.user_email)
    const preview = document.createElement('span')
    const parentPreview = parent.deleted ? '(deleted)' :
      (parent.content || (parent.attachment_type === 'image' ? 'image' : 'voice message'))
    preview.textContent = parentPreview.slice(0, 60) + (parentPreview.length > 60 ? '…' : '')
    ctx.appendChild(who)
    ctx.appendChild(preview)
    ctx.onclick = () => {
      const el = document.querySelector(`.msg[data-id="${parent.id}"]`)
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); flash(el) }
    }
    wrap.appendChild(ctx)
  }

  const avatarDiv = document.createElement('div')
  avatarDiv.className = 'avatar'
  renderAvatar(avatarDiv, profileCache[m.user_email], m.user_email)

  const body = document.createElement('div')
  body.className = 'body'

  const meta = document.createElement('div')
  meta.className = 'meta'
  const nameSpan = document.createElement('span')
  nameSpan.className = 'name'
  const senderProfile = profileCache[m.user_email] || {}
  nameSpan.textContent = displayNameFor(m.user_email)
  if (senderProfile.name_color) nameSpan.style.color = senderProfile.name_color
  if (isVerified(m.user_email)) nameSpan.appendChild(makeVerifiedBadge())
  const tag = makeTag(senderProfile)
  if (tag) nameSpan.appendChild(tag)
  const timeSpan = document.createElement('span')
  timeSpan.className = 'time'
  timeSpan.textContent = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  meta.appendChild(nameSpan)
  meta.appendChild(timeSpan)

  body.appendChild(meta)

  if (m.deleted) {
    const textDiv = document.createElement('div')
    textDiv.className = 'text'
    textDiv.textContent = 'message deleted'
    body.appendChild(textDiv)
  } else {
    if (m.content) {
      const textDiv = document.createElement('div')
      textDiv.className = 'text'
      textDiv.textContent = m.content
      body.appendChild(textDiv)
    }
    if (m.attachment_url) {
      const attach = document.createElement('div')
      attach.className = 'attach-preview'
      if (m.attachment_type === 'image') {
        const img = document.createElement('img')
        img.src = m.attachment_url
        img.loading = 'lazy'
        img.onclick = () => window.open(m.attachment_url, '_blank')
        attach.appendChild(img)
      } else if (m.attachment_type === 'audio') {
        const audio = document.createElement('audio')
        audio.src = m.attachment_url
        audio.controls = true
        attach.appendChild(audio)
      }
      body.appendChild(attach)
    }
  }

  const reactions = m.reactions || {}
  const keys = Object.keys(reactions).filter(k => Array.isArray(reactions[k]) && reactions[k].length > 0)
  if (keys.length > 0) {
    const rdiv = document.createElement('div')
    rdiv.className = 'reactions'
    for (const key of keys) {
      const users = reactions[key]
      const pill = document.createElement('div')
      pill.className = 'reaction-pill' + (users.includes(me.email) ? ' mine' : '')

      const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
      icon.setAttribute('class', 'ico ico-sm')
      icon.setAttribute('viewBox', '0 0 24 24')
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use')
      use.setAttribute('href', `#${REACTIONS[key]}`)
      icon.appendChild(use)
      pill.appendChild(icon)

      const count = document.createElement('span')
      count.className = 'rc'
      count.textContent = users.length
      pill.appendChild(count)
      pill.title = users.map(u => displayNameFor(u)).join(', ')
      pill.onclick = () => toggleReaction(m.id, key)
      rdiv.appendChild(pill)
    }
    body.appendChild(rdiv)
  }

  wrap.appendChild(avatarDiv)
  wrap.appendChild(body)

  if (!m.deleted) {
    const actions = document.createElement('div')
    actions.className = 'msg-actions'

    const replyBtn = document.createElement('button')
    replyBtn.title = 'Reply'
    replyBtn.innerHTML = '<svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-reply"/></svg>'
    replyBtn.onclick = (e) => { e.stopPropagation(); startReply(m) }
    actions.appendChild(replyBtn)

    const reactBtn = document.createElement('button')
    reactBtn.title = 'React'
    reactBtn.innerHTML = '<svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-smile"/></svg>'
    reactBtn.onclick = (e) => { e.stopPropagation(); showReactionPicker(reactBtn, m.id) }
    actions.appendChild(reactBtn)

    if (m.user_email === me.email) {
      const delBtn = document.createElement('button')
      delBtn.title = 'Delete'
      delBtn.innerHTML = '<svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-trash"/></svg>'
      delBtn.onclick = (e) => { e.stopPropagation(); softDelete(m.id) }
      actions.appendChild(delBtn)
    }
    wrap.appendChild(actions)
  }

  return wrap
}

async function toggleReaction(msgId, key) {
  const m = messagesCache[msgId]
  if (!m) return
  const reactions = { ...(m.reactions || {}) }
  const users = new Set(reactions[key] || [])
  if (users.has(me.email)) users.delete(me.email)
  else users.add(me.email)
  reactions[key] = [...users]
  if (reactions[key].length === 0) delete reactions[key]
  const { error } = await supabase.from('messages')
    .update({ reactions }).eq('id', msgId)
  if (error) { console.error(error); alert('Could not react: ' + error.message) }
}

$('micBtn').onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop()
    return
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    recordedChunks = []
    mediaRecorder = new MediaRecorder(stream)
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data) }
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop())
      const blob = new Blob(recordedChunks, { type: 'audio/webm' })
      const file = new File([blob], `voice-${Date.now()}.webm`, { type: 'audio/webm' })
      setPendingAttachment(file, 'audio')
      $('micBtn').classList.remove('recording')
    }
    mediaRecorder.start()
    $('micBtn').classList.add('recording')
  } catch (err) { alert('Microphone error: ' + err.message) }
}
async function uploadAttachment(file, type) {
  const ext = (file.name.split('.').pop() || (type === 'image' ? 'png' : 'webm')).toLowerCase()
  const path = `${me.id}/${Date.now()}.${ext}`
  const { error } = await supabase.storage
    .from('attachments')
    .upload(path, file, { contentType: file.type, upsert: false })
  if (error) throw error
  const { data } = supabase.storage.from('attachments').getPublicUrl(path)
  return data.publicUrl
}

async function sendMessage() {

    user_email: me.email

  if (pendingAttachment) {

  const { error } = await supabase.from('messages').insert(patch)

let pc = null, localStream = null, callChannel = null
let audioCtx = null, analyser = null, meterRAF = null
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }

function setCallButtonState(state) {
  $('btnCall').disabled = state
  $('btnHangup').disabled = !state
  $('btnCall').classList.toggle('active', state)
  $('btnCall').innerHTML = `<svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-phone"/></svg> ${state ? 'In Call' : 'Begin Call'}`
}
async function ensureLocalStream() {
  if (localStream) return localStream
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true })
  startMeter(localStream)
  return localStream
}
function startMeter(stream) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
  const src = audioCtx.createMediaStreamSource(stream)
  analyser = audioCtx.createAnalyser()
  analyser.fftSize = 64
  src.connect(analyser)
  const bars = $('meter').children
  const data = new Uint8Array(analyser.frequencyBinCount)
  const tick = () => {
    analyser.getByteFrequencyData(data)
    for (let i = 0; i < bars.length; i++) {
      const v = data[i * 2] || 0
      bars[i].style.height = (3 + (v / 255) * 16) + 'px'
      bars[i].style.background = v > 15 ? '#fff' : '#222'
    }
    meterRAF = requestAnimationFrame(tick)
  }
  tick()
}
function stopMeter() {
  if (meterRAF) cancelAnimationFrame(meterRAF)
  meterRAF = null
  for (const b of $('meter').children) { b.style.height = '3px'; b.style.background = '#222' }
}
function callRoomId() {
  return activeRoom.type === 'dm' ? 'call:' + activeRoom.id : 'call:channel:' + activeRoom.id
}
function createPeer() {
  pc = new RTCPeerConnection(rtcConfig)
  pc.onicecandidate = e => {
    if (e.candidate && callChannel) callChannel.send({
      type: 'broadcast', event: 'ice', payload: e.candidate
    })
  }
  pc.ontrack = e => { $('remoteAudio').srcObject = e.streams[0] }
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      $('btnCall').innerHTML = `<svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-phone"/></svg> Connected`
    }
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) cleanupCall()
  }
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream))
  return pc
}
async function joinCallChannel() {
  if (callChannel) await supabase.removeChannel(callChannel)
  const room = activeRoom
  callChannel = supabase.channel(callRoomId(), { config: { broadcast: { self: false } } })
  callChannel
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      if (!pc) {
        const who = payload.from || 'someone'
        notify('Incoming Call', `${displayNameFor(who)} is calling`, 'call-' + room.id)
        await ensureLocalStream()
        createPeer()
      }
      await pc.setRemoteDescription(payload.sdp)
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)
      callChannel.send({ type: 'broadcast', event: 'answer', payload: { sdp: answer, from: me.email } })
    })
    .on('broadcast', { event: 'answer' }, async ({ payload }) => {
      if (pc && pc.signalingState === 'have-local-offer') {
        await pc.setRemoteDescription(payload.sdp)
      }
    })
    .on('broadcast', { event: 'ice' }, async ({ payload }) => {
      if (pc) { try { await pc.addIceCandidate(payload) } catch (e) {} }
    })
    .on('broadcast', { event: 'hangup' }, () => cleanupCall())
    .subscribe()
}
async function startCall() {
  try {
    await ensureLocalStream()
    await joinCallChannel()
    createPeer()
    const offer = await pc.createOffer()
    await pc.setLocalDescription(offer)
    callChannel.send({ type: 'broadcast', event: 'offer', payload: { sdp: offer, from: me.email } })
    setCallButtonState(true)
  } catch (e) { alert('Call failed: ' + e.message) }
}
async function cleanupCall() {
  try {
    if (callChannel) {
      await callChannel.send({ type: 'broadcast', event: 'hangup', payload: {} })
      await supabase.removeChannel(callChannel)
      callChannel = null
    }
  } catch (e) {}
  if (pc) { pc.close(); pc = null }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null }
  stopMeter()
  $('remoteAudio').srcObject = null
  setCallButtonState(false)
}
$('btnCall').onclick = startCall
$('btnHangup').onclick = cleanupCall
</script>
</body>
