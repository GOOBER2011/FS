<!DOCTYPE html>
<html lang="en" class="h-full bg-[#111214]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FS - Direct Messaging & Friends Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            fs: {
              darkest: '#111214',
              header: '#1e1f22',
              sidebar: '#2b2d31',
              chat: '#313338',
              hover: '#383a40',
              active: '#404249',
              purple: '#7C3AED',       /* Rich Vibrant Purple */
              purpleDark: '#6D28D9',   /* Deep Purple */
              purpleLight: '#8B5CF6',  /* Bright Purple */
              purpleSoft: '#A78BFA',   /* Soft Purple */
              purpleBg: '#2E1065',     /* Dark Purple Tint */
              muted: '#949ba4',
              light: '#f2f3f5',
              green: '#23a55a',
              yellow: '#f0b232',
              red: '#f23f43'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Flat Scrollbar - No Glow */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #2b2d31;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #111214;
    }

    /* Strict NO Glow animations */
    .animate-fadeIn {
      animation: fadeIn 0.15s ease-out forwards;
    }
    .animate-scaleUp {
      animation: scaleUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-slideUp {
      animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tooltip Arrow */
    .tooltip-arrow::after {
      content: '';
      position: absolute;
      left: -4px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 5px 5px 5px 0;
      border-style: solid;
      border-color: transparent #111214 transparent transparent;
    }

    /* Voice Bar Pulse */
    .voice-bar {
      animation: voicePulse 1s infinite ease-in-out alternate;
    }
    .voice-bar:nth-child(2) { animation-delay: 0.2s; }
    .voice-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes voicePulse {
      0% { height: 4px; }
      100% { height: 16px; }
    }
  </style>
</head>

  <!-- Dynamic Modal Container -->

  <!-- Application Logic JavaScript -->
  <script>
    // Audio Synth Engine (Zero external audio URL dependencies)
    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playMsg() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(783.99, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
        } catch(e) {}
      },
      playVoiceConnect() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch(e) {}
      }
    };

    // Helper: Generate Initial SVG Avatar Data URL
    function createInitialAvatar(name, bgColor = '#7C3AED') {
      const initials = name ? name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'FS';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
        <rect width="128" height="128" fill="${bgColor}" />
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="50" font-weight="bold">${initials}</text>
      </svg>`;
      return 'data:image/svg+xml;base64,' + btoa(svg);
    }

    const STORAGE_KEY = 'FS_DISCORD_REALTIME_STATE_V3';
    const BROADCAST_CHANNEL_NAME = 'FS_APP_REALTIME_SYNC';

    // Cross-tab Realtime Sync via BroadcastChannel API
    const broadcast = new BroadcastChannel(BROADCAST_CHANNEL_NAME);

    // Initial Test Profiles for Dual-Tab Testing
    const DEFAULT_PROFILES = [
      {
        id: 'user_alex',
        name: 'Alex Rivera',
        username: 'alex_rivera',
        tag: '1337',
        avatar: createInitialAvatar('Alex Rivera', '#7C3AED'),
        bannerColor: '#7C3AED',
        status: 'online',
        customStatus: 'Building on FS 💜',
        bio: 'Frontend enthusiast & developer.'
      },
      {
        id: 'user_sam',
        name: 'Sam Vance',
        username: 'sam_vance',
        tag: '2026',
        avatar: createInitialAvatar('Sam Vance', '#2563EB'),
        bannerColor: '#2563EB',
        status: 'online',
        customStatus: 'Testing Direct Messaging!',
        bio: 'Fullstack designer and chat power-user.'
      },
      {
        id: 'user_maya',
        name: 'Maya Lin',
        username: 'maya_lin',
        tag: '9900',
        avatar: createInitialAvatar('Maya Lin', '#059669'),
        bannerColor: '#059669',
        status: 'idle',
        customStatus: 'Designing UI themes 🎨',
        bio: 'Product designer.'
      }
    ];

    // Default Application State
    const defaultState = {
      currentUserId: 'user_alex',
      profiles: DEFAULT_PROFILES,
      friends: [
        { id: 'f1', user1Id: 'user_alex', user2Id: 'user_sam', status: 'accepted' },
        { id: 'f2', user1Id: 'user_alex', user2Id: 'user_maya', status: 'pending_outgoing' }
      ],
      activeView: 'home', // 'home' or 'server'
      friendsTab: 'online', // 'online', 'all', 'pending', 'add_friend'
      activeDMUserId: 'user_sam',
      activeServerId: 's_fs',
      activeChannelId: 'c_welcome',
      userSearchQuery: '',
      pendingAttachment: null,
      voice: {
        connected: false,
        channelId: null,
        channelName: '',
        muted: false,
        deafened: false
      },
      userSelfMuted: false,
      userSelfDeafened: false,
      memberListVisible: true,
      supabaseConfig: {
        url: '',
        anonKey: '',
        connected: false
      },
      servers: [
        {
          id: 's_fs',
          name: 'FS Community',
          iconText: 'FS',
          channels: [
            { id: 'c_welcome', name: 'welcome', type: 'text', topic: 'Welcome to FS! Complete dark grey & purple workspace.' },
            { id: 'c_general', name: 'general', type: 'text', topic: 'General discussions.' },
            { id: 'v_lounge', name: '🔊 Lounge', type: 'voice' }
          ]
        }
      ],
      messages: {
        c_welcome: [
          {
            id: 'm_wel_1',
            userId: 'user_alex',
            timestamp: 'Today at ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            content: 'Welcome to **FS**! 💜 Test private chats by switching accounts or opening 2 tabs side-by-side!',
            reactions: [{ emoji: '💜', count: 1, users: ['user_alex'] }]
          }
        ],
        // DMs key format: "dm_user1_user2" (sorted alphabetically)
        dm_user_alex_user_sam: [
          {
            id: 'm_dm_1',
            userId: 'user_sam',
            timestamp: 'Today at ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            content: 'Hey Alex! This direct message is private between us. Try sending an image attachment or emoji!',
            reactions: [{ emoji: '🔥', count: 1, users: ['user_alex'] }]
          }
        ]
      }
    };

    // Load or initialize state
    let state = loadState();
    let supabaseClient = null;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return parsed;
        }
      } catch(e) {}
      return defaultState;
    }

    function saveState(broadcastSync = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (broadcastSync) {
          broadcast.postMessage({ type: 'STATE_UPDATED', payload: state });
        }
      } catch(e) {}
    }

    // Listen to cross-tab BroadcastChannel events
    broadcast.onmessage = (event) => {
      if (event.data && event.data.type === 'STATE_UPDATED') {
        const currentActiveUser = state.currentUserId;
        state = event.data.payload;
        // Keep active logged in user for this tab if different
        state.currentUserId = currentActiveUser;
        renderAll();
      }
    };

    // Initialize Supabase Client if Credentials Exist
    function initSupabaseClient() {
      if (state.supabaseConfig.url && state.supabaseConfig.anonKey && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(state.supabaseConfig.url, state.supabaseConfig.anonKey);
          state.supabaseConfig.connected = true;
          console.log('Supabase client connected successfully!');
        } catch(e) {
          state.supabaseConfig.connected = false;
        }
      } else {
        state.supabaseConfig.connected = false;
      }
    }

    // Get current logged-in user object
    function getCurrentUser() {
      return state.profiles.find(p => p.id === state.currentUserId) || state.profiles[0];
    }

    // Get any user object by ID
    function getUser(userId) {
      return state.profiles.find(p => p.id === userId) || {
        id: userId,
        name: 'User',
        username: 'user',
        tag: '0000',
        avatar: createInitialAvatar('User', '#4B5563'),
        status: 'offline',
        customStatus: '',
        bio: 'FS User'
      };
    }

    // Helper: DM Message Key helper (Alphabetically sorted IDs)
    function getDMKey(user1Id, user2Id) {
      const sorted = [user1Id, user2Id].sort();
      return `dm_${sorted[0]}_${sorted[1]}`;
    }

    // Initial render on load
    window.addEventListener('DOMContentLoaded', () => {
      initSupabaseClient();
      renderAll();

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });
    });

    function renderAll() {
      renderServerRail();
      renderSidebar();
      renderMainHeader();
      renderMainBody();
      renderUserBar();
      renderMemberList();
    }

    // 1. Render Left Server Rail
    function renderServerRail() {
      const container = document.getElementById('server-rail-list');
      container.innerHTML = state.servers.map(server => {
        const isActive = state.activeView === 'server' && state.activeServerId === server.id;
        const pillClass = isActive ? 'h-10 opacity-100' : 'h-0 opacity-0 group-hover:h-5 group-hover:opacity-100';
        const bgClass = isActive ? 'bg-fs-purple text-white rounded-[16px]' : 'bg-fs-sidebar hover:bg-fs-purple text-fs-light hover:rounded-[16px] rounded-[24px]';

        return `
          <div class="relative group flex items-center justify-center w-full">
            <div class="absolute left-0 w-[4px] bg-fs-purple rounded-r-full transition-all duration-200 ${pillClass}"></div>
            <button onclick="switchServer('${server.id}')" class="w-12 h-12 ${bgClass} font-bold text-sm flex items-center justify-center transition-all duration-200 shadow-sm">
              ${server.iconText || server.name.substring(0, 2).toUpperCase()}
            </button>
            <div class="absolute left-[80px] px-3 py-1.5 bg-fs-darkest text-fs-light text-xs font-semibold rounded-md shadow-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 z-50 whitespace-nowrap tooltip-arrow border border-white/5">
              ${server.name}
            </div>
          </div>
        `;
      }).join('');

      const homePill = document.getElementById('pill-home');
      if (homePill) {
        homePill.className = `absolute left-0 w-[4px] bg-fs-purple rounded-r-full transition-all duration-200 ${state.activeView === 'home' ? 'h-10 opacity-100' : 'h-0 opacity-0 group-hover:h-5 group-hover:opacity-100'}`;
      }
    }

    // 2. Render Sidebar Navigation (DMs List or Channels List)
    function renderSidebar() {
      const headerContainer = document.getElementById('sidebar-header');
      const contentContainer = document.getElementById('sidebar-content');
      const me = getCurrentUser();

      if (state.activeView === 'home') {
        headerContainer.innerHTML = `
          <div class="font-bold text-fs-light text-sm flex items-center space-x-2">
            <span class="text-fs-purple">💜</span>
            <span>FS Workspace</span>
          </div>
        `;

        // Filter direct message friends list
        const myFriendsList = getAcceptedFriends(me.id);

        contentContainer.innerHTML = `
          <!-- Friends Navigation Item -->
          <button onclick="openFriendsDashboard()" class="w-full flex items-center space-x-3 px-2.5 py-2 rounded-md text-sm transition-colors ${state.activeDMUserId === null ? 'bg-fs-active text-white font-semibold' : 'text-fs-muted hover:bg-fs-hover/50 hover:text-fs-light'}">
            <i class="fa-solid fa-user-group text-fs-purple"></i>
            <span>Friends</span>
            ${getPendingIncomingCount(me.id) > 0 ? `<span class="ml-auto bg-fs-red text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">${getPendingIncomingCount(me.id)}</span>` : ''}
          </button>

          <div class="pt-2">
            <div class="flex items-center justify-between text-xs font-bold text-fs-muted uppercase tracking-wider px-2 mb-1">

                <i class="fa-solid fa-plus"></i>

            </div>

            <div class="space-y-0.5">
              ${myFriendsList.length === 0 ? `

                  <button onclick="setFriendsTab('add_friend'); openFriendsDashboard();" class="text-xs text-fs-purpleSoft hover:underline font-semibold">Add a friend</button>
                </div>
              ` : myFriendsList.map(friend => {

                    <div class="min-w-0 flex-1">
                      <div class="text-xs font-semibold truncate group-hover:text-fs-light">${friend.name}</div>

                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

      } else {
        const server = state.servers.find(s => s.id === state.activeServerId);
        if (!server) return;

        headerContainer.innerHTML = `
          <span class="font-bold text-fs-light text-sm truncate">${server.name}</span>
          <i class="fa-solid fa-chevron-down text-xs text-fs-muted"></i>
        `;

        const textChannels = server.channels.filter(c => c.type === 'text');
        const voiceChannels = server.channels.filter(c => c.type === 'voice');

        contentContainer.innerHTML = `
          <div>
            <div class="flex items-center justify-between text-xs font-bold text-fs-muted uppercase tracking-wider px-2 mb-1">
              <span>Text Channels</span>
              <i class="fa-solid fa-plus text-[10px] cursor-pointer hover:text-fs-light" onclick="openModal('create-channel')"></i>
            </div>
            <div class="space-y-0.5">
              ${textChannels.map(ch => {
                const isActive = state.activeChannelId === ch.id;
                return `
                  <button onclick="switchChannel('${ch.id}')" class="w-full flex items-center space-x-2 px-2 py-1.5 rounded-md text-sm transition-colors ${isActive ? 'bg-fs-active text-white font-medium' : 'text-fs-muted hover:bg-fs-hover/50 hover:text-fs-light'}">
                    <span class="text-fs-purple font-bold text-base leading-none">#</span>
                    <span class="truncate">${ch.name}</span>
                  </button>
                `;

              ${voiceChannels.map(vc => {

                  <button onclick="connectVoice('${vc.id}', '${vc.name}')" class="w-full flex items-center justify-between px-2 py-1.5 rounded-md text-sm transition-colors ${isConnected ? 'bg-fs-hover text-fs-green font-semibold' : 'text-fs-muted hover:bg-fs-hover/50 hover:text-fs-light'}">
                    <div class="flex items-center space-x-2 truncate">
                      <i class="fa-solid fa-volume-high text-xs"></i>

    // 3. Render Top Header
    function renderMainHeader() {
      const container = document.getElementById('main-header');
      const me = getCurrentUser();

      if (state.activeView === 'home' && state.activeDMUserId === null) {
        // Friends Management Tab Header
        container.innerHTML = `
          <div class="flex items-center space-x-4 min-w-0">
            <div class="flex items-center space-x-2 font-bold text-fs-light text-base border-r border-[#3f4147] pr-4">
              <i class="fa-solid fa-user-group text-fs-purple"></i>
              <span>Friends</span>
            </div>

            <!-- Friends Sub-Tabs -->
            <div class="flex items-center space-x-1 text-xs font-semibold text-fs-muted">
              <button onclick="setFriendsTab('online')" class="px-3 py-1.5 rounded-md transition-colors ${state.friendsTab === 'online' ? 'bg-fs-hover text-white font-bold' : 'hover:bg-fs-hover/40 hover:text-fs-light'}">Online</button>
              <button onclick="setFriendsTab('all')" class="px-3 py-1.5 rounded-md transition-colors ${state.friendsTab === 'all' ? 'bg-fs-hover text-white font-bold' : 'hover:bg-fs-hover/40 hover:text-fs-light'}">All</button>
              <button onclick="setFriendsTab('pending')" class="px-3 py-1.5 rounded-md transition-colors relative ${state.friendsTab === 'pending' ? 'bg-fs-hover text-white font-bold' : 'hover:bg-fs-hover/40 hover:text-fs-light'}">
                Pending
                ${getPendingIncomingCount(me.id) > 0 ? `<span class="ml-1.5 bg-fs-red text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">${getPendingIncomingCount(me.id)}</span>` : ''}
              </button>
              <button onclick="setFriendsTab('add_friend')" class="px-3 py-1.5 rounded-md transition-colors bg-fs-purple text-white hover:bg-fs-purpleDark font-bold ml-2">Add Friend</button>
            </div>
          </div>
        `;
      } else if (state.activeView === 'home' && state.activeDMUserId !== null) {
        // Direct Message Chat Header
        const friend = getUser(state.activeDMUserId);
        container.innerHTML = `
          <div class="flex items-center space-x-3 min-w-0">
            <div class="relative">
              <img src="${friend.avatar}" class="w-8 h-8 rounded-full object-cover">
              <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-fs-chat ${getStatusBg(friend.status)}"></div>
            </div>
            <div class="font-bold text-fs-light text-base truncate">${friend.name}</div>
            <span class="text-xs text-fs-muted truncate hidden sm:inline">@${friend.username} #${friend.tag}</span>
          </div>

          <div class="flex items-center space-x-3 text-fs-muted shrink-0">
            <button onclick="openUserProfile('${friend.id}')" class="hover:text-fs-light text-xs font-semibold bg-fs-sidebar px-2.5 py-1 rounded border border-white/5 transition-colors">
              View Profile
            </button>
          </div>
        `;
      } else {
        // Server Channel Header
        const server = state.servers.find(s => s.id === state.activeServerId);
        const channel = server ? server.channels.find(c => c.id === state.activeChannelId) : null;

        container.innerHTML = `
          <div class="flex items-center space-x-3 min-w-0">
            <span class="text-fs-purple text-lg font-bold">#</span>
            <h2 class="font-bold text-fs-light text-base truncate">${channel ? channel.name : 'general'}</h2>
            <div class="h-4 w-[1px] bg-[#3f4147] hidden md:block"></div>
            <span class="text-xs text-fs-muted truncate hidden md:block">${channel ? channel.topic || '' : ''}</span>
          </div>
        `;
      }
    }

    // 4. Render Main Body (Chat or Friends Dashboard)
    function renderMainBody() {
      const chatContainer = document.getElementById('chat-container');
      const friendsDashboard = document.getElementById('friends-dashboard');

      if (state.activeView === 'home' && state.activeDMUserId === null) {
        chatContainer.classList.add('hidden');
        friendsDashboard.classList.remove('hidden');
        renderFriendsDashboard();
      } else {
        friendsDashboard.classList.add('hidden');
        chatContainer.classList.remove('hidden');
        renderMessages();
      }
    }

    // 5. Render Friends Dashboard Tab
    function renderFriendsDashboard() {
      const container = document.getElementById('friends-dashboard');
      const me = getCurrentUser();

      if (state.friendsTab === 'add_friend') {
        container.innerHTML = `
          <div class="max-w-2xl space-y-6 animate-fadeIn">
            <div>
              <h2 class="text-xl font-bold text-fs-light uppercase tracking-wide mb-1">Add Friend</h2>
              <p class="text-xs text-fs-muted">You can add friends using their username and tag. (Example: <code class="bg-fs-darkest px-1.5 py-0.5 rounded text-fs-purpleSoft">sam_vance#2026</code>)</p>
            </div>

            <div class="bg-fs-darkest p-4 rounded-xl border border-white/10 space-y-3">
              <label class="text-xs font-bold text-fs-muted uppercase block">Friend Username#Tag</label>
              <div class="flex items-center bg-fs-header rounded-lg border border-white/5 px-3 py-1 focus-within:border-fs-purple">
                <input type="text" id="add-friend-input" placeholder="username#tag" class="w-full bg-transparent text-sm text-fs-light outline-none py-2 placeholder-fs-muted">
                <button onclick="sendFriendRequest()" class="bg-fs-purple hover:bg-fs-purpleDark text-white font-semibold text-xs px-5 py-2 rounded-md transition-colors shrink-0">
                  Send Friend Request
                </button>
              </div>
              <div id="add-friend-feedback" class="text-xs hidden"></div>
            </div>

            <!-- Quick Dual-Tab Test Help Banner -->
            <div class="bg-fs-purpleBg/40 border border-fs-purple/30 p-4 rounded-xl space-y-2">
              <div class="flex items-center space-x-2 text-fs-purpleSoft font-bold text-sm">
                <i class="fa-solid fa-circle-info"></i>
                <span>Cross-Tab Realtime Testing</span>
              </div>
              <p class="text-xs text-fs-muted leading-relaxed">
                Open this app in 2 browser tabs! Click the <i class="fa-solid fa-users-between-lines text-fs-purpleSoft"></i> icon in the left rail to switch user accounts in one tab. Friend requests and 1-on-1 direct messages will sync across tabs in real-time!
              </p>
            </div>
          </div>
        `;
        return;
      }

      let friendsList = [];
      if (state.friendsTab === 'online') {
        friendsList = getAcceptedFriends(me.id).filter(f => f.status !== 'offline');
      } else if (state.friendsTab === 'all') {
        friendsList = getAcceptedFriends(me.id);
      }

      if (state.friendsTab === 'pending') {
        const pendingIncoming = getPendingIncoming(me.id);
        const pendingOutgoing = getPendingOutgoing(me.id);

        container.innerHTML = `
          <div class="space-y-6 max-w-3xl animate-fadeIn">
            <div>
              <div class="text-xs font-bold text-fs-muted uppercase tracking-wider mb-3">Incoming Requests — ${pendingIncoming.length}</div>
              <div class="space-y-2">
                ${pendingIncoming.length === 0 ? `
                  <div class="text-xs text-fs-muted italic">No pending incoming requests.</div>
                ` : pendingIncoming.map(user => `
                  <div class="flex items-center justify-between bg-fs-darkest p-3 rounded-xl border border-white/5 hover:border-white/10 transition-colors">
                    <div class="flex items-center space-x-3">
                      <img src="${user.avatar}" class="w-10 h-10 rounded-full object-cover">
                      <div>
                        <div class="font-bold text-sm text-fs-light">${user.name}</div>
                        <div class="text-xs text-fs-muted">@${user.username} #${user.tag}</div>
                      </div>
                    </div>
                    <div class="flex items-center space-x-2">
                      <button onclick="acceptFriendRequest('${user.id}')" class="bg-fs-green hover:bg-green-600 text-white p-2 rounded-full text-xs transition-colors" title="Accept">
                        <i class="fa-solid fa-check px-1"></i>
                      </button>
                      <button onclick="declineFriendRequest('${user.id}')" class="bg-fs-hover hover:bg-fs-red text-fs-muted hover:text-white p-2 rounded-full text-xs transition-colors" title="Decline">
                        <i class="fa-solid fa-xmark px-1"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="pt-4 border-t border-white/5">
              <div class="text-xs font-bold text-fs-muted uppercase tracking-wider mb-3">Outgoing Requests — ${pendingOutgoing.length}</div>
              <div class="space-y-2">
                ${pendingOutgoing.length === 0 ? `
                  <div class="text-xs text-fs-muted italic">No pending outgoing requests.</div>
                ` : pendingOutgoing.map(user => `
                  <div class="flex items-center justify-between bg-fs-darkest p-3 rounded-xl border border-white/5">
                    <div class="flex items-center space-x-3">
                      <img src="${user.avatar}" class="w-10 h-10 rounded-full object-cover">
                      <div>
                        <div class="font-bold text-sm text-fs-light">${user.name}</div>
                        <div class="text-xs text-fs-muted">@${user.username} #${user.tag}</div>
                      </div>
                    </div>
                    <button onclick="declineFriendRequest('${user.id}')" class="text-xs text-fs-muted hover:text-fs-red px-3 py-1 rounded bg-fs-sidebar hover:bg-fs-hover transition-colors">
                      Cancel Request
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>

      // Render Online or All Friends
      container.innerHTML = `
        <div class="space-y-4 max-w-3xl animate-fadeIn">
          <div class="text-xs font-bold text-fs-muted uppercase tracking-wider">
            ${state.friendsTab === 'online' ? 'Online Friends' : 'All Friends'} — ${friendsList.length}
          </div>

          <div class="space-y-2">
            ${friendsList.length === 0 ? `
              <div class="flex flex-col items-center justify-center py-16 space-y-3 text-fs-muted">
                <div class="w-16 h-16 rounded-full bg-fs-purple/10 flex items-center justify-center text-3xl text-fs-purple">💜</div>
                <div class="font-bold text-fs-light">No friends found</div>
                <button onclick="setFriendsTab('add_friend'); renderFriendsDashboard();" class="text-xs text-fs-purpleSoft hover:underline font-semibold">
                  Add a friend with their username and tag
                </button>
              </div>
            ` : friendsList.map(user => `
              <div class="flex items-center justify-between bg-fs-sidebar/60 hover:bg-fs-sidebar p-3 rounded-xl border border-white/5 transition-colors group">
                <div class="flex items-center space-x-3 min-w-0">
                  <div class="relative shrink-0">
                    <img src="${user.avatar}" class="w-10 h-10 rounded-full object-cover">
                    <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-fs-sidebar ${getStatusBg(user.status)}"></div>
                  </div>
                  <div class="min-w-0">
                    <div class="font-bold text-sm text-fs-light truncate">${user.name}</div>

                  </button>
                </div>
              </div>

    // 6. Render Messages Feed
    function renderMessages() {
      const stream = document.getElementById('messages-stream');
      const me = getCurrentUser();

      let msgKey = state.activeChannelId;
      if (state.activeView === 'home' && state.activeDMUserId !== null) {
        msgKey = getDMKey(me.id, state.activeDMUserId);
      }

      const channelMsgs = state.messages[msgKey] || [];

      if (channelMsgs.length === 0) {
        stream.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full text-fs-muted space-y-3 py-16">
            <div class="w-16 h-16 rounded-full bg-fs-purple/10 flex items-center justify-center text-3xl text-fs-purple">
              💜
            </div>
            <div class="text-base font-bold text-fs-light">This is the beginning of direct messaging</div>
            <div class="text-xs text-center max-w-sm text-fs-muted">Say hello to kick off the conversation!</div>
          </div>
        `;
        return;
      }

      stream.innerHTML = channelMsgs.map(msg => {
        const user = getUser(msg.userId);
        const isSelf = msg.userId === me.id;

        return `
          <div class="group relative flex space-x-3 hover:bg-fs-hover/30 p-2 -mx-2 rounded-lg transition-colors animate-slideUp">
            <img onclick="openUserProfile('${user.id}')" src="${user.avatar}" class="w-10 h-10 rounded-full object-cover cursor-pointer hover:opacity-80 transition-opacity shrink-0 border border-white/10">
            
            <div class="flex-1 min-w-0">
              <div class="flex items-center space-x-2">
                <span onclick="openUserProfile('${user.id}')" class="font-bold text-fs-light text-sm hover:underline cursor-pointer">${user.name}</span>
                <span class="text-[11px] text-fs-muted">${msg.timestamp}</span>
              </div>

              <div class="text-sm text-fs-light mt-0.5 leading-relaxed break-words">${escapeHTML(msg.content)}</div>

              ${msg.attachment ? `
                <div class="mt-2 max-w-md rounded-lg overflow-hidden border border-white/10 shadow-sm">
                  <img src="${msg.attachment}" class="w-full h-auto object-cover max-h-72">
                </div>
              ` : ''}

              ${msg.reactions && msg.reactions.length > 0 ? `
                <div class="flex flex-wrap gap-1.5 mt-2">
                  ${msg.reactions.map((r, rIdx) => {
                    const reactedByMe = r.users.includes(me.id);
                    return `
                      <button onclick="toggleReaction('${msgKey}', '${msg.id}', ${rIdx})" class="flex items-center space-x-1 px-2 py-0.5 rounded-md text-xs border transition-all ${reactedByMe ? 'bg-fs-purple/20 border-fs-purple text-fs-purpleSoft' : 'bg-fs-sidebar border-white/5 text-fs-muted hover:border-fs-muted'}">
                        <span>${r.emoji}</span>
                        <span class="font-semibold">${r.count}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>

            <!-- Hover Action Toolbar -->
            <div class="absolute right-2 -top-3 hidden group-hover:flex items-center bg-fs-header border border-white/10 rounded-md shadow-lg text-fs-muted px-1 py-0.5 space-x-1 z-10">
              <button onclick="quickReact('${msgKey}', '${msg.id}', '💜')" class="hover:text-fs-light p-1 rounded">💜</button>
              <button onclick="quickReact('${msgKey}', '${msg.id}', '👍')" class="hover:text-fs-light p-1 rounded">👍</button>
              <button onclick="replyToMessage('${msg.id}')" class="hover:text-fs-light p-1 rounded text-xs"><i class="fa-solid fa-reply"></i></button>
              ${isSelf ? `<button onclick="deleteMessage('${msgKey}', '${msg.id}')" class="hover:text-fs-red p-1 rounded text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
            </div>
          </div>
        `;
      }).join('');

      stream.scrollTop = stream.scrollHeight;
    }

    // 7. Render Member List Sidebar (For Servers)
    function renderMemberList() {
      const container = document.getElementById('member-list-content');
      if (state.activeView === 'home') {
        document.getElementById('member-sidebar').classList.add('hidden');
        return;
      }

      document.getElementById('member-sidebar').classList.remove('hidden');
      container.innerHTML = `
        <div>
          <div class="text-xs font-bold text-fs-muted uppercase tracking-wider px-2 mb-2">
            MEMBERS — ${state.profiles.length}
          </div>

    // --- FRIEND SYSTEM LOGIC ---

    function getAcceptedFriends(userId) {
      const friendRecords = state.friends.filter(f => f.status === 'accepted' && (f.user1Id === userId || f.user2Id === userId));
      return friendRecords.map(f => {
        const otherId = f.user1Id === userId ? f.user2Id : f.user1Id;
        return getUser(otherId);
      });
    }

    function getPendingIncoming(userId) {
      const friendRecords = state.friends.filter(f => f.status === 'pending_outgoing' && f.user2Id === userId);
      return friendRecords.map(f => getUser(f.user1Id));
    }

    function getPendingOutgoing(userId) {
      const friendRecords = state.friends.filter(f => f.status === 'pending_outgoing' && f.user1Id === userId);
      return friendRecords.map(f => getUser(f.user2Id));
    }

    function getPendingIncomingCount(userId) {
      return getPendingIncoming(userId).length;
    }

    function sendFriendRequest() {
      const input = document.getElementById('add-friend-input');
      const feedback = document.getElementById('add-friend-feedback');
      const val = input.value.trim().toLowerCase();
      const me = getCurrentUser();

      feedback.classList.remove('hidden', 'text-fs-green', 'text-fs-red');

      if (!val.includes('#')) {
        feedback.innerText = 'Please enter the full username and tag (e.g. sam_vance#2026)';
        feedback.classList.add('text-fs-red');
        return;
      }

      const [targetUsername, targetTag] = val.split('#');
      const targetUser = state.profiles.find(p => p.username.toLowerCase() === targetUsername && p.tag === targetTag);

      if (!targetUser) {
        feedback.innerText = 'User not found. Try testing with sam_vance#2026 or maya_lin#9900!';
        feedback.classList.add('text-fs-red');
        return;
      }

      if (targetUser.id === me.id) {
        feedback.innerText = 'You cannot add yourself as a friend.';
        feedback.classList.add('text-fs-red');
        return;
      }

      // Check existing relationship
      const existing = state.friends.find(f => 
        (f.user1Id === me.id && f.user2Id === targetUser.id) ||
        (f.user1Id === targetUser.id && f.user2Id === me.id)
      );

      if (existing) {
        if (existing.status === 'accepted') {
          feedback.innerText = 'You are already friends with ' + targetUser.name + '!';
        } else {
          feedback.innerText = 'A friend request is already pending for this user.';
        }
        feedback.classList.add('text-fs-red');
        return;
      }

      // Create outgoing pending request
      state.friends.push({
        id: 'f_' + Date.now(),
        user1Id: me.id,
        user2Id: targetUser.id,
        status: 'pending_outgoing'
      });

      saveState();
      input.value = '';
      feedback.innerText = 'Friend request sent to ' + targetUser.name + '!';
      feedback.classList.add('text-fs-green');
      
      setTimeout(() => renderAll(), 1000);
    }

    function acceptFriendRequest(senderUserId) {
      const me = getCurrentUser();
      const record = state.friends.find(f => f.user1Id === senderUserId && f.user2Id === me.id);
      if (record) {
        record.status = 'accepted';
        saveState();
        renderAll();
      }
    }

    function declineFriendRequest(otherUserId) {
      const me = getCurrentUser();
      state.friends = state.friends.filter(f => 
        !((f.user1Id === me.id && f.user2Id === otherUserId) || (f.user1Id === otherUserId && f.user2Id === me.id))
      );
      saveState();
      renderAll();
    }

    function removeFriend(friendUserId) {
      declineFriendRequest(friendUserId);
      if (state.activeDMUserId === friendUserId) {
        state.activeDMUserId = null;
      }
    }

    // --- MESSAGING LOGIC ---

    function handleInputKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function handleAttachmentUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        state.pendingAttachment = evt.target.result;
        sendMessage();
      };
      reader.readAsDataURL(file);
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      const me = getCurrentUser();

      if (!text && !state.pendingAttachment) return;

      let msgKey = state.activeChannelId;
      if (state.activeView === 'home' && state.activeDMUserId !== null) {
        msgKey = getDMKey(me.id, state.activeDMUserId);
      }

      const newMsg = {
        id: 'm_' + Date.now(),
        userId: me.id,
        timestamp: 'Today at ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        content: text,
        attachment: state.pendingAttachment || null,
        reactions: []
      };

      if (!state.messages[msgKey]) {
        state.messages[msgKey] = [];
      }

      state.messages[msgKey].push(newMsg);

      input.value = '';
      state.pendingAttachment = null;
      cancelReply();
      saveState();

      SoundFX.playMsg();
      renderMessages();
    }

    function toggleReaction(msgKey, msgId, rIdx) {
      const msgs = state.messages[msgKey] || [];
      const msg = msgs.find(m => m.id === msgId);
      const me = getCurrentUser();
      if (!msg) return;

      const reaction = msg.reactions[rIdx];
      const userIdx = reaction.users.indexOf(me.id);

      if (userIdx > -1) {
        reaction.users.splice(userIdx, 1);
        reaction.count--;
        if (reaction.count <= 0) {
          msg.reactions.splice(rIdx, 1);
        }
      } else {
        reaction.users.push(me.id);
        reaction.count++;
      }
      saveState();
      renderMessages();
    }

    function quickReact(msgKey, msgId, emoji) {
      const msgs = state.messages[msgKey] || [];
      const msg = msgs.find(m => m.id === msgId);
      const me = getCurrentUser();
      if (!msg) return;

      const existing = msg.reactions.find(r => r.emoji === emoji);
      if (existing) {
        if (!existing.users.includes(me.id)) {
          existing.users.push(me.id);
          existing.count++;
        }
      } else {
        msg.reactions.push({ emoji, count: 1, users: [me.id] });
      }
      saveState();
      renderMessages();
    }

    function replyToMessage(msgId) {
      const me = getCurrentUser();
      let msgKey = state.activeChannelId;
      if (state.activeView === 'home' && state.activeDMUserId !== null) {
        msgKey = getDMKey(me.id, state.activeDMUserId);

      const msgs = state.messages[msgKey] || [];

      document.getElementById('reply-user-name').innerText = user.name;
      document.getElementById('reply-banner').classList.remove('hidden');
      document.getElementById('message-input').focus();
    }

    function cancelReply() {

    function deleteMessage(msgKey, msgId) {
      if (state.messages[msgKey]) {
        state.messages[msgKey] = state.messages[msgKey].filter(m => m.id !== msgId);
        saveState();
        renderMessages();

    }

        modalContainer.innerHTML = `
          <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
            <div class="bg-fs-chat w-full max-w-md rounded-2xl p-6 shadow-2xl border border-white/10 animate-scaleUp">
              <h3 class="text-lg font-bold text-fs-light mb-3">Create Text Channel</h3>
              <input type="text" id="new-channel-name" placeholder="new-channel" class="w-full bg-fs-darkest border border-white/10 rounded-md p-2.5 text-sm text-fs-light outline-none mb-4 focus:border-fs-purple">
              
              <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 text-xs text-fs-muted hover:text-fs-light">Cancel</button>
                <button onclick="createNewChannel()" class="bg-fs-purple hover:bg-fs-purpleDark text-white text-xs font-bold px-5 py-2 rounded-md transition-colors">Create Channel</button>
              </div>
            </div>
          </div>
        `;
      }
    }

    function switchSettingsTab(tab) {
      document.getElementById('settings-tab-profile').classList.toggle('hidden', tab !== 'profile');
      document.getElementById('settings-tab-supabase').classList.toggle('hidden', tab !== 'supabase');

      document.getElementById('tab-btn-profile').className = `w-full text-left px-3 py-2 rounded-md text-sm font-semibold flex items-center space-x-2 ${tab === 'profile' ? 'bg-fs-purple text-white' : 'text-fs-muted hover:text-fs-light'}`;
      document.getElementById('tab-btn-supabase').className = `w-full text-left px-3 py-2 rounded-md text-sm font-semibold flex items-center space-x-2 ${tab === 'supabase' ? 'bg-fs-purple text-white' : 'text-fs-muted hover:text-fs-light'}`;
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    let tempAvatarBase64 = null;

    function handleAvatarFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        tempAvatarBase64 = evt.target.result;
        document.getElementById('preview-avatar').src = tempAvatarBase64;
      };
      reader.readAsDataURL(file);
    }

    function generateInitialsAvatar() {
      const me = getCurrentUser();
      const name = document.getElementById('input-name').value || me.name;
      tempAvatarBase64 = createInitialAvatar(name, '#7C3AED');
      document.getElementById('preview-avatar').src = tempAvatarBase64;
    }

    function updateLivePreview() {
      const name = document.getElementById('input-name').value;
      const username = document.getElementById('input-username').value;
      const tag = document.getElementById('input-tag').value;
      const status = document.getElementById('input-status').value;
      const custom = document.getElementById('input-custom-status').value;

      document.getElementById('preview-name').innerText = name || 'User';
      document.getElementById('preview-tag').innerText = `@${username || 'user'} #${tag || '0000'}`;
      document.getElementById('preview-custom').innerText = custom;
      document.getElementById('preview-status').className = `absolute bottom-0 right-0 w-4 h-4 rounded-full border-2 border-fs-sidebar ${getStatusBg(status)}`;
    }

    function saveProfileSettings() {
      const me = getCurrentUser();
      me.name = document.getElementById('input-name').value.trim() || 'Alex Rivera';
      me.username = document.getElementById('input-username').value.trim() || 'alex_rivera';
      me.tag = document.getElementById('input-tag').value.trim() || '1337';
      me.status = document.getElementById('input-status').value;
      me.customStatus = document.getElementById('input-custom-status').value.trim();
      me.bio = document.getElementById('input-bio').value.trim();

      if (tempAvatarBase64) {
        me.avatar = tempAvatarBase64;
      }

      saveState();
      renderAll();
      closeModal();
    }

    function saveSupabaseConfig() {
      state.supabaseConfig.url = document.getElementById('input-sb-url').value.trim();
      state.supabaseConfig.anonKey = document.getElementById('input-sb-key').value.trim();

      initSupabaseClient();
      saveState();
      closeModal();
    }

    function createNewServer() {
      const name = document.getElementById('new-server-name').value.trim() || 'FS Server';
      const id = 's_' + Date.now();

      state.servers.push({
        id,
        name,
        iconText: name.substring(0, 2).toUpperCase(),
        channels: [
          { id: 'c_' + Date.now(), name: 'general', type: 'text', topic: 'Welcome to ' + name }
        ]
      });

      saveState();
      switchServer(id);
      closeModal();
    }

    function createNewChannel() {
      const name = document.getElementById('new-channel-name').value.trim().toLowerCase().replace(/\s+/g, '-') || 'channel';
      const server = state.servers.find(s => s.id === state.activeServerId);
      
      if (server) {
        const id = 'c_' + Date.now();
        server.channels.push({ id, name, type: 'text', topic: '#' + name });
        saveState();
        switchChannel(id);
      }
      closeModal();
    }

    function copySQLSchema() {
      const sql = `-- FS Realtime Supabase PostgreSQL Database Schema
CREATE TABLE IF NOT EXISTS public.profiles (
  id TEXT PRIMARY KEY,
  name TEXT NOT NULL,
  username TEXT NOT NULL,
  tag TEXT NOT NULL,
  avatar TEXT,
  status TEXT DEFAULT 'online',
  custom_status TEXT,
  bio TEXT,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now())
);

CREATE TABLE IF NOT EXISTS public.friends (
  id TEXT PRIMARY KEY,
  user1_id TEXT NOT NULL,
  user2_id TEXT NOT NULL,
  status TEXT NOT NULL DEFAULT 'pending_outgoing',
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now())
);

CREATE TABLE IF NOT EXISTS public.direct_messages (
  id TEXT PRIMARY KEY,
  channel_key TEXT NOT NULL,
  sender_id TEXT NOT NULL,
  recipient_id TEXT NOT NULL,
  content TEXT NOT NULL,
  attachment TEXT,
  reactions JSONB DEFAULT '[]'::jsonb,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now())
);

-- Enable Supabase Realtime for Direct Messages
ALTER PUBLICATION supabase_realtime ADD TABLE public.direct_messages;
ALTER PUBLICATION supabase_realtime ADD TABLE public.friends;`;

      const el = document.createElement('textarea');
      el.value = sql;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);

      alert('Supabase SQL Schema script copied to clipboard!');
    }

    // Helper Functions
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    function getStatusBg(status) {
      switch(status) {
        case 'online': return 'bg-fs-green';
        case 'idle': return 'bg-fs-yellow';
        case 'dnd': return 'bg-fs-red';
        default: return 'bg-fs-muted';
      }
    }
  </script>
</body>
</html>
